name: Publish YouTube Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful IPA workflow run ID to publish'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-youtube-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Check source workflow run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID must be numeric'; exit 1; }
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$REPO" '
            .repository.full_name == $repo and
            .path == ".github/workflows/build-ipa.yml" and
            .head_branch == "main" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success"
          ' run.json >/dev/null
          sha="$(jq -r '.head_sha' run.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=youtube-build-${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download final IPA only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts ipa
          gh run download "$RUN_ID" --repo "$REPO" --name YouTube-IPA --dir artifacts
          find artifacts -type f -name '*.ipa' -exec cp {} ipa/ \;
          shopt -s nullglob
          ipas=(ipa/*.ipa)
          if (( ${#ipas[@]} != 1 )); then
            printf 'Expected exactly 1 IPA, found %s\n' "${#ipas[@]}" >&2
            exit 1
          fi
          file "${ipas[0]}"
          python3 - "${ipas[0]}" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert any(p.startswith('Payload/') and p.endswith('.app/Info.plist') for p in z.namelist())
          PY
          sha256sum "${ipas[0]}" > SHA256SUMS.txt

      - name: Create a new GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Not overwriting it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SOURCE_SHA" \
            --title "YouTube IPA (run $RUN_ID)" \
            --notes "Built from successful IPA workflow run $RUN_ID. Contains the YouTube IPA only. Optional jailbreak tweaks may not work on a non-jailbroken device." \
            ipa/*.ipa SHA256SUMS.txt
          echo "Release: https://github.com/$REPO/releases/tag/$TAG"
