name: IPA (YTKACE + optional prebuilt tweak injection)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Decrypted YouTube IPA URL
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: RYD direct IPA injection (prebuilt; default OFF)
        type: boolean
        default: false
      add_ytuhd:
        description: YTUHD direct IPA injection (prebuilt; default OFF)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig direct IPA injection (prebuilt; default OFF)
        type: boolean
        default: false
      add_youquality:
        description: YouQuality direct IPA injection (requires prebuilt YTVideoOverlay; default OFF)
        type: boolean
        default: false
      add_youslider:
        description: YouSlider direct IPA injection (prebuilt; default OFF)
        type: boolean
        default: false
      add_youmute:
        description: YouMute direct IPA injection (requires prebuilt YTVideoOverlay; default OFF)
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote direct IPA injection (prebuilt; default OFF)
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent direct IPA injection (prebuilt; default OFF)
        type: boolean
        default: false
      add_yougetcaption:
        description: YouGetCaption direct IPA injection (requires prebuilt YTVideoOverlay; default OFF)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  ytkace:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Build YTKACE Rootless DEB and extract shipped library
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
          mkdir -p built-ytkace built-deb extracted
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Rootless DEB, found ${#packages[@]}" >&2
            exit 1
          fi
          version="$(awk '/^Version:/ {print $2}' control)"
          test -n "$version"
          deb="built-deb/com.itzzace.ytkace_${version}_rootless.deb"
          cp "${packages[0]}" "$deb"
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY_YTKACE'
          from pathlib import Path
          import shutil, struct, sys
          libs=[p for p in Path('extracted').rglob('YTKACE.dylib') if p.is_file()]
          if len(libs)!=1:
              sys.exit(f'Expected exactly one YTKACE.dylib in DEB, found: {libs}')
          p=libs[0]
          with p.open('rb') as f:
              magic=f.read(4)
              endian={b'\xfe\xed\xfa\xce':'>',b'\xce\xfa\xed\xfe':'<',b'\xfe\xed\xfa\xcf':'>',b'\xcf\xfa\xed\xfe':'<'}
              if magic not in endian:
                  sys.exit(f'YTKACE is not thin Mach-O: {p}; magic={magic.hex()}')
              f.seek(12)
              kind=struct.unpack(endian[magic]+'I',f.read(4))[0]
              if kind!=6:
                  sys.exit(f'YTKACE library has Mach-O type {kind}, expected MH_DYLIB (6): {p}')
          shutil.copy2(p,'built-ytkace/YTKACE.dylib')
          print('Using packaged real YTKACE library:',p)
          PY_YTKACE
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-library
          path: built-ytkace/YTKACE.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-rootless
          path: built-deb/*.deb
          if-no-files-found: error

  package:
    needs: [ytkace]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Optional repository variable. If blank, use latest published release.
      PREBUILT_RELEASE_TAG: ${{ vars.TWEAK_RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-library
          path: built-ytkace
      - name: Install signing tool
        run: brew install ldid
      - name: Download decrypted YouTube IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PYVALIDATE'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'Not a valid IPA/ZIP'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(p.startswith('Payload/') and p.endswith('.app/Info.plist') for p in z.namelist())
          PYVALIDATE
      - name: Resolve only checked prebuilt tweak libraries (NO extra tweak compilation)
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
          ADD_YTUHD: ${{ inputs.add_ytuhd }}
          ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
          ADD_YOUQUALITY: ${{ inputs.add_youquality }}
          ADD_YOUSLIDER: ${{ inputs.add_youslider }}
          ADD_YOUMUTE: ${{ inputs.add_youmute }}
          ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
          ADD_YOUGETCAPTION: ${{ inputs.add_yougetcaption }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selected-dylibs
          selected=()
          [[ "$ADD_RYD" == true ]] && selected+=(YouTubeDislikesReturn.dylib)
          [[ "$ADD_YTUHD" == true ]] && selected+=(YTUHD.dylib)
          [[ "$ADD_YTABCONFIG" == true ]] && selected+=(YTABConfig.dylib)
          [[ "$ADD_YOUQUALITY" == true ]] && selected+=(YouQuality.dylib)
          [[ "$ADD_YOUSLIDER" == true ]] && selected+=(YouSlider.dylib)
          [[ "$ADD_YOUMUTE" == true ]] && selected+=(YouMute.dylib)
          [[ "$ADD_YTSILENTVOTE" == true ]] && selected+=(YTSilentVote.dylib)
          [[ "$ADD_DONTEATMYCONTENT" == true ]] && selected+=(DontEatMyContent.dylib)
          [[ "$ADD_YOUGETCAPTION" == true ]] && selected+=(YouGetCaption.dylib)
          if [[ "$ADD_YOUQUALITY" == true || "$ADD_YOUMUTE" == true || "$ADD_YOUGETCAPTION" == true ]]; then
            selected+=(YTVideoOverlay.dylib)
          fi
          # Empty selection is valid. No extra .dylib is fetched or injected.
          if (( ${#selected[@]} == 0 )); then
            echo 'All additional tweaks OFF: YTKACE only.'
            exit 0
          fi
          release_tag="$PREBUILT_RELEASE_TAG"
          for name in "${selected[@]}"; do
            if [[ -s "prebuilt-tweaks/$name" ]]; then
              cp "prebuilt-tweaks/$name" "selected-dylibs/$name"
              echo "LOCAL PREBUILT: $name"
            else
              if [[ -z "$release_tag" ]]; then
                release_tag="$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || true)"
              fi
              if [[ -z "$release_tag" ]]; then
                echo "ERROR: $name missing from prebuilt-tweaks/ and no GitHub Release available." >&2
                exit 1
              fi
              echo "Fetching $name from Release $release_tag"
              gh release download "$release_tag" --repo "$REPO" --pattern "$name" --dir selected-dylibs || {
                echo "ERROR: $name not found in Release $release_tag. Add prebuilt-tweaks/$name or set repository variable TWEAK_RELEASE_TAG to a release that contains it." >&2
                exit 1
              }
            fi
            test -s "selected-dylibs/$name" || { echo "ERROR: Empty or missing: $name" >&2; exit 1; }
          done
          python3 - <<'PYMACHO'
          from pathlib import Path
          import struct
          thin={b'\xfe\xed\xfa\xce':'>',b'\xce\xfa\xed\xfe':'<',b'\xfe\xed\xfa\xcf':'>',b'\xcf\xfa\xed\xfe':'<'}
          for p in sorted(Path('selected-dylibs').glob('*.dylib')):
              with p.open('rb') as f:
                  magic=f.read(4)
                  if magic not in thin:
                      raise SystemExit(f'Invalid or fat Mach-O, expecting thin MH_DYLIB: {p}; magic={magic.hex()}')
                  f.seek(12)
                  kind=struct.unpack(thin[magic]+'I',f.read(4))[0]
              if kind!=6:
                  raise SystemExit(f'Not an executable MH_DYLIB (type {kind}): {p}')
              print('VALID PREBUILT:',p)
          PYMACHO
          echo 'Selected tweak libraries (will be embedded into IPA):'
          find selected-dylibs -name '*.dylib' -type f -print | sort
      - name: Inject YTKACE and checked prebuilt tweaks
        id: inject
        shell: bash
        run: |
          set -euo pipefail
          export LDID="$(brew --prefix)/bin/ldid"
          ytkace=built-ytkace/YTKACE.dylib
          test -s "$ytkace"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY_VERSION'
          import plistlib, zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info=next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PY_VERSION
          )"
          output="YouTube_${youtube_version}_YTKACE_${version}.ipa"
          bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output"
          shopt -s nullglob
          extras=(selected-dylibs/*.dylib)
          if (( ${#extras[@]} )); then
            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT
            unzip -q "$output" -d "$work"
            app="$(find "$work/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
            test -n "$app"
            main_name="$(python3 - "$app/Info.plist" <<'PY_MAIN'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: print(plistlib.load(f)['CFBundleExecutable'])
          PY_MAIN
            )"
            mkdir -p "$app/Frameworks"
            for lib in "${extras[@]}"; do
              name="$(basename "$lib")"
              cp "$lib" "$app/Frameworks/$name"
              python3 Tools/macho_inject.py "$app/$main_name" --add-load "@rpath/$name"
              echo "DIRECT INJECTION: $name"
            done
            bash Scripts/sign-bundle.sh "$app"
            rm -f "$output"
            (cd "$work" && zip -qry "$OLDPWD/$output" Payload)
          fi
          bash Tools/verify-artifacts.sh "$ytkace" "$output"
          python3 - "$output" <<'PY_CHECK'
          import sys,zipfile
          from pathlib import Path
          expected={p.name for p in Path('selected-dylibs').glob('*.dylib')}
          with zipfile.ZipFile(sys.argv[1]) as z:
              names={p.rsplit('/',1)[-1] for p in z.namelist() if '/Frameworks/' in p and p.endswith('.dylib')}
          if 'YTKACE.dylib' not in names: raise SystemExit('YTKACE.dylib missing')
          if not expected.issubset(names): raise SystemExit(f'Missing checked tweaks: {expected-names}')
          forbidden={'YouTubeDislikesReturn.dylib','YTUHD.dylib','YTABConfig.dylib',
                     'YouQuality.dylib','YouSlider.dylib','YouMute.dylib',
                     'YTSilentVote.dylib','DontEatMyContent.dylib','YouGetCaption.dylib','YTVideoOverlay.dylib'}
          extra=names & forbidden
          if extra!=expected: raise SystemExit(f'Unexpected tweak injection: expected={expected}, got={extra}')
          print('IPA verified. Injected:', sorted(expected))
          PY_CHECK
          echo "ipa=$output" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

  publish-release:
    name: Publish IPA + DEB to GitHub Releases
    needs: [ytkace, package]
    if: ${{ github.ref == 'refs/heads/main' && needs.ytkace.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: youtube-build-${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: YouTube-IPA
          path: release-files/ipa
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: release-files/deb
      - name: Validate and publish Release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(release-files/ipa/*.ipa)
          debs=(release-files/deb/*.deb)
          if (( ${#ipas[@]} != 1 || ${#debs[@]} != 1 )); then
            printf 'Expected exactly one IPA and one DEB; found IPA=%d DEB=%d\n' "${#ipas[@]}" "${#debs[@]}" >&2
            exit 1
          fi
          dpkg-deb --info "${debs[0]}" >/dev/null
          assets=("${ipas[0]}" "${debs[0]}")
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$REPO"
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "YouTube IPA + YTKACE DEB (run $GITHUB_RUN_ID)" \
              --notes "YTKACE IPA and Rootless DEB. Only checked, previously built tweak libraries are injected into IPA; no extra tweak compilation or individual dylib artifacts." \
              "${assets[@]}"
          fi
          echo "https://github.com/$REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
