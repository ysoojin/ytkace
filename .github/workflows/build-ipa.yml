name: IPA (YTKACE + selectable tweaks)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Decrypted YouTube IPA URL
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: Return YouTube Dislikes
        type: boolean
        default: true
      add_ytabconfig:
        description: YTABConfig
        type: boolean
        default: true
      add_youslider:
        description: YouSlider
        type: boolean
        default: true
      add_ytsilentvote:
        description: YTSilentVote
        type: boolean
        default: true
      add_donteatmycontent:
        description: DontEatMyContent (duplicate symbol fix)
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  ytkace:
    uses: ./.github/workflows/build-deb.yml

  extra-tweaks:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Install shared headers
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/include"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          test -f "$THEOS/include/PSHeader/Misc.h"
          test -f "$THEOS/include/YouTubeHeader/YTLikeStatus.h"

      - name: Build selected tweaks
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
          ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
          ADD_YOUSLIDER: ${{ inputs.add_youslider }}
          ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
        run: |
          set -euo pipefail
          mkdir -p extra-built sources

          build_tweak() {
            local key="$1" repo="$2" flag="$3"
            if [[ "$flag" != true ]]; then
              echo "SKIP $key"
              return
            fi
            echo "Building $key from $repo"
            local checkout="sources/$key"
            git clone --depth 1 --recurse-submodules "https://github.com/${repo}.git" "$checkout"
            pushd "$checkout"

            if [[ "$key" == donteatmycontent ]]; then
              # Tweak.h defines a global that is compiled into two .o files.
              # Keep one definition in Tweak.x; declare it extern in Tweak.h.
              python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('Tweak.h')
          s = p.read_text()
          before = 'CGFloat constant;'
          assert s.count(before) == 1, 'Unexpected upstream Tweak.h; do not patch blindly'
          p.write_text(s.replace(before, 'extern CGFloat constant;', 1))
          t = Path('Tweak.x')
          t_src = t.read_text()
          marker = '#import "Tweak.h"'
          assert marker in t_src, 'Unexpected Tweak.x imports'
          t.write_text(t_src.replace(marker, marker + '\nCGFloat constant;', 1))
          PYFIX
            fi

            make clean || true
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
            deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
            test -n "$deb" || { echo "No DEB from $key" >&2; exit 1; }
            cp "$deb" "../../extra-built/${key}.deb"
            popd
          }

          build_tweak ryd PoomSmart/Return-YouTube-Dislikes "$ADD_RYD"
          build_tweak ytabconfig PoomSmart/YTABConfig "$ADD_YTABCONFIG"
          build_tweak youslider PoomSmart/YouSlider "$ADD_YOUSLIDER"
          build_tweak ytsilentvote PoomSmart/YTSilentVote "$ADD_YTSILENTVOTE"
          build_tweak donteatmycontent therealFoxster/DontEatMyContent "$ADD_DONTEATMYCONTENT"
          printf 'Selected tweak packages.\n' > extra-built/README.txt
          find extra-built -maxdepth 1 -name '*.deb' -print | sort

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-selected-extra-debs
          path: extra-built/
          if-no-files-found: error

  package:
    needs: [ytkace, extra-tweaks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-selected-extra-debs
          path: extra-packages
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PYVALIDATE'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'Not a valid IPA/ZIP'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist') for n in z.namelist())
          PYVALIDATE
      - name: Inject YTKACE and selected tweaks
        id: inject
        run: |
          set -euo pipefail
          mkdir -p deb-root
          dpkg-deb -x "$(find packages -maxdepth 1 -name '*.deb' -print -quit)" deb-root
          ytkace="$(find deb-root -name YTKACE.dylib -print -quit)"
          test -n "$ytkace"
          export LDID="$(brew --prefix)/bin/ldid"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PYVERSION'
          import plistlib, zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info = next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PYVERSION
          )"
          output="YouTube_${youtube_version}_YTKACE_${version}.ipa"
          mkdir -p extra-root
          # Extract all selected tweaks first; no library is injected until vetted.
          shopt -s nullglob
          for deb in extra-packages/*.deb; do
            key="$(basename "$deb" .deb)"
            mkdir -p "extra-root/$key"
            dpkg-deb -x "$deb" "extra-root/$key"
          done
          # Exclude YTUHD, YouQuality, YouMute, YouGetCaption and helper YTVideoOverlay.
          # No blanket substrate filter is used.
          # Each selected package must provide exactly one unique dylib.
          python3 - <<'PYSELECT'
          from pathlib import Path
          import sys
          root = Path('extra-root')
          libs = sorted(p for p in root.rglob('*.dylib') if p.is_file())
          excluded = {'ytuhd', 'youquality', 'youmute', 'yougetcaption', 'ytvideooverlay'}
          names = set()
          selected = []
          for lib in libs:
              key = lib.relative_to(root).parts[0].lower()
              if key in excluded or lib.name.lower() == 'ytvideooverlay.dylib':
                  print('SKIP blocked tweak:', lib)
                  continue
              if lib.name in names:
                  sys.exit('Duplicate dylib name: ' + lib.name)
              names.add(lib.name)
              selected.append(lib)
              print('INCLUDED:', lib.name)
          Path('selected-dylibs.txt').write_text(''.join(str(p) + '\n' for p in selected))
          print(f'Selected {len(selected)} additional dylibs')
          PYSELECT
          dylibs=()
          while IFS= read -r lib; do
            if [[ -n "$lib" ]]; then
              dylibs+=("$lib")
            fi
          done < selected-dylibs.txt
          if [[ -s selected-dylibs.txt ]]; then
            bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output" "${dylibs[@]}"
          else
            bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output"
          fi
          bash Tools/verify-artifacts.sh "$ytkace" "$output"
          # Verify the final archive even when no optional tweak is eligible.
          python3 - "$output" "$ytkace" <<'PYVERIFY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              files = set(z.namelist())
              expected = [pathlib.Path(line.strip()).name for line in
                          pathlib.Path('selected-dylibs.txt').read_text().splitlines() if line.strip()]
              for name in expected:
                  assert any(p.endswith('/Frameworks/' + name) for p in files), f'Missing library: {name}'
          print('All requested dylibs are present')
          PYVERIFY
          echo "ipa=$output" >> "$GITHUB_OUTPUT"
      - name: Report included tweaks
        if: always()
        shell: bash
        run: |
          if [[ -f selected-dylibs.txt ]]; then
            echo '### Injected extra dylibs' >> "$GITHUB_STEP_SUMMARY"
            cat selected-dylibs.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

      - name: Trigger Release publication
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$GITHUB_RUN_ID"
