name: IPA (YTKACE built-in RYD for Shorts/details + v10.17 main counts 30s)
'on':
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct URL to your decrypted YouTube IPA (required; no default)
        required: true
        type: string
        default: ''
      ytkace_ref:
        description: 'Official YTKACE release: latest or tag (e.g. v1.1.7)'
        required: true
        type: string
        default: latest
      add_ryd:
        description: 'Extra RYD: regular-video button counts, 30s refresh (default ON)'
        type: boolean
        default: true
      ryd_diagnostics:
        description: 'Patch extra RYD: disable Shorts/details duplicate; enable 30s labels (ON)'
        type: boolean
        default: true
      add_ytuhd:
        description: YTUHD (default OFF)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig (default OFF)
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote (default OFF)
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent (untested; default OFF)
        type: boolean
        default: false
      add_youmute:
        description: YouMute + required YTVideoOverlay (default OFF)
        type: boolean
        default: false
      add_yougroupsettings:
        description: YouGroupSettings grouped tweak settings (default OFF)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  ytkace:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Resolve official YTKACE release
      id: ytkace_release
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.ytkace_ref }}
      shell: bash
      run: "set -euo pipefail\nif [[ \"$REQUESTED_REF\" == latest ]]; then\n  tag=\"$(gh api repos/itzzace/ytkace/releases/latest\
        \ --jq '.tag_name')\"\nelse\n  tag=\"$REQUESTED_REF\"\n  [[ \"$tag\" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] ||\
        \ { echo '::error::Use latest or vX.Y.Z release tag'; exit 1; }\n  gh api \"repos/itzzace/ytkace/releases/tags/$tag\"\
        \ --jq '.tag_name' >/dev/null\nfi\ntest -n \"$tag\"\necho \"tag=$tag\" >> \"$GITHUB_OUTPUT\"\necho \"Official\
        \ YTKACE release: $tag\"\n"
    - uses: actions/checkout@v6
      with:
        repository: itzzace/ytkace
        ref: ${{ steps.ytkace_release.outputs.tag }}
        path: upstream-ytkace
        submodules: recursive
    - name: Install Theos
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
    - name: Build YTKACE Rootless DEB and extract shipped library
      shell: bash
      run: "set -euo pipefail\n# Theos installer can leave incompatible Clang precompiled modules.\n# Isolate this\
        \ run's module cache and avoid parallel module rebuild races.\nrm -rf \"${HOME}/.cache/clang/ModuleCache\"\
        \ \"${THEOS}/obj\"\nexport CLANG_MODULE_CACHE_PATH=\"${RUNNER_TEMP}/ytkace-clang-modules-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\
        \nmkdir -p \"$CLANG_MODULE_CACHE_PATH\"\n(cd upstream-ytkace && make clean && make -j1 package FINALPACKAGE=1\
        \ THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1)\nmkdir -p built-ytkace built-deb extracted\n\
        printf '%s\\n' \"${{ steps.ytkace_release.outputs.tag }}\" > built-ytkace/ytkace-tag.txt\nshopt -s nullglob\n\
        packages=(upstream-ytkace/packages/*.deb)\nif (( ${#packages[@]} != 1 )); then\n  echo \"Expected exactly\
        \ one Rootless DEB, found ${#packages[@]}\" >&2\n  exit 1\nfi\nversion=\"$(dpkg-deb --field \"${packages[0]}\"\
        \ Version)\"\ntest -n \"$version\"\nprintf '%s\\n' \"$version\" > built-ytkace/ytkace-version.txt\necho\
        \ \"YTKACE package actual version: $version\"\ndeb=\"built-deb/com.itzzace.ytkace_${version}_rootless.deb\"\
        \ncp \"${packages[0]}\" \"$deb\"\ndpkg-deb --extract \"$deb\" extracted\npython3 - <<'PY_YTKACE'\nfrom pathlib\
        \ import Path\nimport shutil, struct, sys\nlibs=[p for p in Path('extracted').rglob('YTKACE.dylib') if p.is_file()]\n\
        if len(libs)!=1:\n    sys.exit(f'Expected exactly one YTKACE.dylib in DEB, found: {libs}')\np=libs[0]\n\
        with p.open('rb') as f:\n    magic=f.read(4)\n    endian={b'\\xfe\\xed\\xfa\\xce':'>',b'\\xce\\xfa\\xed\\\
        xfe':'<',b'\\xfe\\xed\\xfa\\xcf':'>',b'\\xcf\\xfa\\xed\\xfe':'<'}\n    if magic not in endian:\n       \
        \ sys.exit(f'YTKACE is not thin Mach-O: {p}; magic={magic.hex()}')\n    f.seek(12)\n    kind=struct.unpack(endian[magic]+'I',f.read(4))[0]\n\
        \    if kind!=6:\n        sys.exit(f'YTKACE library has Mach-O type {kind}, expected MH_DYLIB (6): {p}')\n\
        shutil.copy2(p,'built-ytkace/YTKACE.dylib')\nprint('Using packaged real YTKACE library:',p)\nPY_YTKACE\n"
    - uses: actions/upload-artifact@v7
      with:
        name: YTKACE-library
        path: built-ytkace/
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: YTKACE-deb-rootless
        path: built-deb/*.deb
        if-no-files-found: error
  package:
    needs: ytkace
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: YTKACE-library
        path: built-ytkace
    - name: Download YTKACE Rootless DEB for single-pass cyan
      uses: actions/download-artifact@v8
      with:
        name: YTKACE-deb-rootless
        path: built-deb
    - name: Fetch matching official YTKACE packaging assets
      shell: bash
      run: 'set -euo pipefail

        tag="$(cat built-ytkace/ytkace-tag.txt)"

        version="$(cat built-ytkace/ytkace-version.txt)"

        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\ .[0-9]+$ ]]

        test -n "$version"

        git clone --depth 1 --branch "$tag" https://github.com/itzzace/ytkace.git ytkace-upstream

        source_version="$(awk ''/^Version:/ {print $2}'' ytkace-upstream/control)"

        [[ "$source_version" == "$version" ]] || { echo "::error::YTKACE source ($source_version) and built package
        ($version) do not match"; exit 1; }

        test -f ytkace-upstream/Scripts/sideload-repack.sh

        test -f ytkace-upstream/Tools/verify-artifacts.sh

        echo "YTKACE source and IPA packaging both use $tag ($version)" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Install IPA signing tool
      run: brew install ldid
    - name: Install optional DEB and cyan tools
      if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_ytsilentvote || inputs.add_donteatmycontent
        || inputs.add_youmute || inputs.add_yougroupsettings }}
      run: 'set -euo pipefail

        brew install dpkg

        pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

        command -v dpkg-deb

        command -v cyan

        cyan --help >/dev/null

        '
    - name: Install Theos for selected tweaks
      if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_ytsilentvote || inputs.add_donteatmycontent
        || inputs.add_youmute || inputs.add_yougroupsettings }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

        '
    - name: Build selected tweak DEBs together (no individual artifacts)
      env:
        ADD_RYD: ${{ inputs.add_ryd }}
        RYD_DIAGNOSTICS: ${{ inputs.ryd_diagnostics }}
        ADD_YTUHD: ${{ inputs.add_ytuhd }}
        ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
        ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
        ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
        ADD_YOUMUTE: ${{ inputs.add_youmute }}
        ADD_YOUGROUPSETTINGS: ${{ inputs.add_yougroupsettings }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p extra-debs sources\n: > selected-success.txt\n: > selected-failed.txt\n\
        : > requested-tweaks.txt\nfor pair in \"ryd:$ADD_RYD\" \"ytuhd:$ADD_YTUHD\" \"ytabconfig:$ADD_YTABCONFIG\"\
        \ \"ytsilentvote:$ADD_YTSILENTVOTE\" \"donteatmycontent:$ADD_DONTEATMYCONTENT\" \"youmute:$ADD_YOUMUTE\"\
        \ \"yougroupsettings:$ADD_YOUGROUPSETTINGS\"; do\n  if [[ \"${pair##*:}\" == true ]]; then printf '%s\\\
        n' \"${pair%%:*}\" >> requested-tweaks.txt; fi\ndone\n# Optional tweak build failures are reported, not\
        \ fatal.\nmkdir -p \"$THEOS/include\"\ngit clone --depth 1 https://github.com/PoomSmart/PSHeader.git \"\
        $THEOS/include/PSHeader\" || echo 'WARN: PSHeader unavailable (some tweaks may fail)'\ngit clone --depth\
        \ 1 https://github.com/PoomSmart/YouTubeHeader.git \"$THEOS/include/YouTubeHeader\" || echo 'WARN: YouTubeHeader\
        \ unavailable (some tweaks may fail)'\nif [[ \"$ADD_YTUHD\" == true ]]; then\n  brew install meson ninja\
        \ pkg-config autoconf automake libtool nasm yasm || echo 'WARN: YTUHD build tools setup failed'\nfi\n\n\
        build_one() {\n  local key=\"$1\" repo=\"$2\" flag=\"$3\" out=\"sources/$1\"\n  [[ \"$flag\" == true ]]\
        \ || return 0\n  echo \"::group::Building optional tweak $key\"\n  if ! git clone --depth 1 --recurse-submodules\
        \ \"https://github.com/$repo.git\" \"$out\"; then\n    echo \"FAILED $key: git clone\" | tee -a selected-failed.txt\n\
        \    echo '::endgroup::'\n    return 0\n  fi\n  # RYD upstream filters only the stock bundle ID. Sideload\
        \ signing\n  # may change CFBundleIdentifier, preventing Substrate from loading\n  # an otherwise correctly\
        \ injected dylib. Match the executable\n  # instead, which remains \"YouTube\" for this IPA build.\n  if\
        \ [[ \"$key\" == ryd ]]; then\n    python3 - \"$out\" <<'PY_RYD_FILTER'\nfrom pathlib import Path\nimport\
        \ plistlib, sys\nroot = Path(sys.argv[1])\np = root / 'YouTubeDislikesReturn.plist'\nif not p.is_file():\n\
        \    sys.exit('RYD filter plist missing: ' + str(p))\n# The upstream file uses OpenStep syntax; write a\
        \ standard XML plist\n# understood by Substrate/Cyan. Only change the loader filter.\noriginal = p.read_text()\n\
        if 'com.google.ios.youtube' not in original or 'Filter' not in original:\n    sys.exit('Unexpected RYD filter\
        \ contents; refusing blind patch')\np.write_bytes(plistlib.dumps({'Filter': {'Executables': ['YouTube']}},\
        \ fmt=plistlib.FMT_XML))\nprint('RYD sideload filter: Executables = YouTube (bundle-ID independent)')\n\
        PY_RYD_FILTER\n  fi\n  if [[ \"$key\" == ryd && \"$RYD_DIAGNOSTICS\" == true ]]; then\n    python3 - \"\
        $out\" <<'PY_RYD_DIAGNOSTIC'\nfrom pathlib import Path\nimport sys\nroot = Path(sys.argv[1])\napi = root\
        \ / 'API.x'\ntweak = root / 'Tweak.x'\nif not api.is_file() or not tweak.is_file():\n    sys.exit('RYD diagnostics:\
        \ required upstream sources not found')\na = api.read_text()\nt = tweak.read_text()\ndef replace_once(source,\
        \ old, new, label):\n    if source.count(old) != 1:\n        sys.exit(f'RYD diagnostics: upstream changed\
        \ ({label}); cannot safely instrument')\n    return source.replace(old, new, 1)\n# No video ID, URL, vote\
        \ data, or account identifiers are printed.\na = replace_once(a,\n    'NSUInteger responseCode = [httpResponse\
        \ statusCode];',\n    'NSUInteger responseCode = [httpResponse statusCode];\\n    NSLog(@\"[RYD-DIAG] API\
        \ HTTP status=%lu networkError=%d\", (unsigned long)responseCode, error != nil);',\n    'API status')\n\
        a = replace_once(a,\n    'dispatch_async(dispatch_get_main_queue(), ^{\\n            dataHandler(myData);',\n\
        \    'NSLog(@\"[RYD-DIAG] API JSON parsed successfully\");\\n        dispatch_async(dispatch_get_main_queue(),\
        \ ^{\\n            dataHandler(myData);',\n    'API JSON callback')\nt = replace_once(t,\n    '    YTQTMButton\
        \ *dislikeButton = self.dislikeButton;',\n    '    NSLog(@\"[RYD-DIAG] Shorts like/dislike hook invoked\"\
        );\\n    YTQTMButton *dislikeButton = self.dislikeButton;',\n    'Shorts hook')\nt = replace_once(t,\n \
        \   '    getVoteFromVideoWithHandler(cache, videoId, maxRetryCount, ^(NSDictionary *data, NSString *error)\
        \ {',\n    '    NSLog(@\"[RYD-DIAG] Requesting vote data from UI hook\");\\n    getVoteFromVideoWithHandler(cache,\
        \ videoId, maxRetryCount, ^(NSDictionary *data, NSString *error) {',\n    'general video request hook')\n\
        t = replace_once(t,\n    '        HBLogDebug(@\"RYD: Vote data for video %@: %@\", videoId, data);',\n \
        \   '        NSLog(@\"[RYD-DIAG] UI vote callback hasData=%d hasError=%d\", data != nil, error != nil);',\n\
        \    'general video callback')\napi.write_text(a)\ntweak.write_text(t)\n# Keep private values (video IDs,\
        \ user IDs, URLs, responses) out of diagnostics.\n# NSUserDefaults is read by the diagnostic entry in the\
        \ RYD settings screen.\ndef append_marker(text, old, replacement, label):\n    if text.count(old) != 1:\n\
        \        sys.exit(f'RYD on-device diagnostics: upstream mismatch ({label})')\n    return text.replace(old,\
        \ replacement, 1)\na = append_marker(a,\n    'NSLog(@\"[RYD-DIAG] API HTTP status=%lu networkError=%d\"\
        , (unsigned long)responseCode, error != nil);',\n    'NSLog(@\"[RYD-DIAG] API HTTP status=%lu networkError=%d\"\
        , (unsigned long)responseCode, error != nil);'\n    '\\n    [[NSUserDefaults standardUserDefaults] setObject:[NSString\
        \ stringWithFormat:@\"HTTP %lu, networkError=%d\", (unsigned long)responseCode, error != nil] forKey:@\"\
        RYDDiagHTTP\"];',\n    'api http marker')\na = append_marker(a,\n    'NSLog(@\"[RYD-DIAG] API JSON parsed\
        \ successfully\");',\n    'NSLog(@\"[RYD-DIAG] API JSON parsed successfully\");'\n    '\\n        [[NSUserDefaults\
        \ standardUserDefaults] setObject:@\"JSON parsed OK\" forKey:@\"RYDDiagJSON\"];',\n    'api data marker')\n\
        t = append_marker(t,\n    'NSLog(@\"[RYD-DIAG] Shorts like/dislike hook invoked\");',\n    'NSLog(@\"[RYD-DIAG]\
        \ Shorts like/dislike hook invoked\");'\n    '\\n    [[NSUserDefaults standardUserDefaults] setObject:@\"\
        Shorts hook called\" forKey:@\"RYDDiagShorts\"];',\n    'shorts marker')\nt = append_marker(t,\n    'NSLog(@\"\
        [RYD-DIAG] Requesting vote data from UI hook\");',\n    'NSLog(@\"[RYD-DIAG] Requesting vote data from UI\
        \ hook\");'\n    '\\n    [[NSUserDefaults standardUserDefaults] setObject:@\"Video UI requested votes\"\
        \ forKey:@\"RYDDiagVideo\"];',\n    'video marker')\nt = append_marker(t,\n    'NSLog(@\"[RYD-DIAG] UI vote\
        \ callback hasData=%d hasError=%d\", data != nil, error != nil);',\n    'NSLog(@\"[RYD-DIAG] UI vote callback\
        \ hasData=%d hasError=%d\", data != nil, error != nil);'\n    '\\n        [[NSUserDefaults standardUserDefaults]\
        \ setObject:[NSString stringWithFormat:@\"hasData=%d, hasError=%d\", data != nil, error != nil] forKey:@\"\
        RYDDiagCallback\"];',\n    'callback marker')\n# v5: observe upstream hook ENTRY before layout / video-ID\
        \ filtering.\n# This distinguishes missing hook invocation from a changed UI layout.\n# No actual IDs, counts,\
        \ media metadata, or account values are recorded.\nearly_anchor = '- (ELMCellNode *)nodeForItemAtIndexPath:(NSIndexPath\
        \ *)indexPath {'\nt = replace_once(t, early_anchor, early_anchor + r'''\n    static BOOL rydDidRecordCollection\
        \ = NO;\n    static BOOL rydDidRecordActionCollection = NO;\n    if (!rydDidRecordCollection) {\n      \
        \  rydDidRecordCollection = YES;\n        [[NSUserDefaults standardUserDefaults] setObject:@\"호출됨\" forKey:@\"\
        RYDPathCollectionEntry\"];\n    }\n    NSString *rydCollectionId = self.accessibilityIdentifier;\n    if\
        \ (!rydDidRecordActionCollection &&\n        [rydCollectionId containsString:@\"video\"] &&\n        [rydCollectionId\
        \ containsString:@\"action_bar\"]) {\n        rydDidRecordActionCollection = YES;\n        // Log a fixed\
        \ label, not arbitrary identifiers from view data.\n        NSString *kind = [rydCollectionId isEqualToString:@\"\
        id.video.scrollable_action_bar\"]\n            ? @\"기존 scrollable_action_bar\"\n            : ([rydCollectionId\
        \ isEqualToString:@\"id.video.non_scrollable_action_bar\"]\n                ? @\"non_scrollable_action_bar\"\
        \ : @\"다른 video action_bar\");\n        [[NSUserDefaults standardUserDefaults] setObject:kind forKey:@\"\
        RYDPathActionKind\"];\n    }\n''' , 'ASCollectionView entry')\n# The upstream matching function uses one\
        \ literal ID; record whether\n# this branch is reached before any potentially fragile tree traversal.\n\
        t = replace_once(t,\n    'else if (isVideoScrollableActionBar(self, node)) {',\n    'else if (isVideoScrollableActionBar(self,\
        \ node)) {\\n        [[NSUserDefaults standardUserDefaults] setObject:@\"진입함\" forKey:@\"RYDPathActionBranch\"\
        ];',\n    'regular action bar branch')\n# Use a hook that v4 proved exists; do not guess signatures for\n\
        # YTReelWatchLikesController's newly named methods.\nshorts_anchor = '%hook YTReelWatchPlaybackOverlayView\\\
        n'\nif t.count(shorts_anchor) != 1:\n    sys.exit('v5: overlay class hook changed')\nbegin, after = t.split(shorts_anchor,\
        \ 1)\nmethod_anchor = '- (void)layoutActionBar {'\nif after.count(method_anchor) < 1:\n    sys.exit('v5:\
        \ overlay layoutActionBar missing')\nafter = after.replace(method_anchor, method_anchor + r'''\n    static\
        \ BOOL rydDidRecordShortOverlay = NO;\n    if (!rydDidRecordShortOverlay) {\n        rydDidRecordShortOverlay\
        \ = YES;\n        [[NSUserDefaults standardUserDefaults] setObject:@\"호출됨\" forKey:@\"RYDPathShortOverlay\"\
        ];\n    }\n''', 1)\nt = begin + shorts_anchor + after\n# v6: capture a bounded, privacy-safe distribution\
        \ of collection IDs\n# and ELM node structure without recording raw identifiers or videos.\n# This occurs\
        \ before the strict upstream action-bar ID check.\nv6_entry = 'ELMCellNode *node = %orig;'\nv6_code = r'''\n\
        \    static NSUInteger rydV6Seen = 0;\n    if (rydV6Seen < 400) {\n        rydV6Seen++;\n        NSString\
        \ *tag = self.accessibilityIdentifier;\n        NSString *bucket = @\"other\";\n        if (tag.length ==\
        \ 0) bucket = @\"empty\";\n        else if ([tag isEqualToString:@\"id.video.scrollable_action_bar\"]) bucket\
        \ = @\"old-scrollable\";\n        else if ([tag isEqualToString:@\"id.video.non_scrollable_action_bar\"\
        ]) bucket = @\"new-nonscrollable\";\n        else if ([tag containsString:@\"action_bar\"]) bucket = @\"\
        other-actionbar\";\n        else if ([tag containsString:@\"video\"]) bucket = @\"other-video\";\n     \
        \   NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];\n        NSString *key = [@\"RYDV6Bucket_\"\
        \ stringByAppendingString:bucket];\n        [defaults setInteger:([defaults integerForKey:key] + 1) forKey:key];\n\
        \        // Record only the structural shape, not user-visible data.\n        if ([bucket isEqualToString:@\"\
        new-nonscrollable\"] ||\n            [bucket isEqualToString:@\"other-actionbar\"] ||\n            [bucket\
        \ isEqualToString:@\"old-scrollable\"]) {\n            NSString *shapeKey = [@\"RYDV6Shape_\" stringByAppendingString:bucket];\n\
        \            if (![defaults objectForKey:shapeKey]) {\n                [defaults setObject:[NSString stringWithFormat:@\"\
        node=%@ children=%lu\",\n                    node ? @\"yes\" : @\"no\", (unsigned long)[node.yogaChildren\
        \ count]] forKey:shapeKey];\n            }\n        }\n        [defaults setInteger:rydV6Seen forKey:@\"\
        RYDV6TotalSeen\"];\n    }\n'''\nt = replace_once(t, v6_entry, v6_entry + v6_code, 'v6 collection telemetry\
        \ entry')\n# v7 runs independently from v6's 400-call limit. Only publish\n# strictly static-looking id.video.*\
        \ identifiers, never arbitrary\n# accessibility labels, video IDs, titles, or account information.\nv7_code\
        \ = r'''\n    static NSUInteger rydV7Observed = 0;\n    if (rydV7Observed < 1500) {\n        @synchronized([NSUserDefaults\
        \ standardUserDefaults]) {\n            NSUserDefaults *d = [NSUserDefaults standardUserDefaults];\n   \
        \         rydV7Observed++;\n            NSString *raw = self.accessibilityIdentifier;\n            if ([raw\
        \ isKindOfClass:[NSString class]] && [raw containsString:@\"video\"] &&\n                ![raw isEqualToString:@\"\
        id.video.scrollable_action_bar\"] &&\n                ![raw isEqualToString:@\"id.video.non_scrollable_action_bar\"\
        ] &&\n                ![raw containsString:@\"action_bar\"]) {\n                [d setInteger:[d integerForKey:@\"\
        RYDV7OtherVideoSeen\"] + 1 forKey:@\"RYDV7OtherVideoSeen\"];\n                BOOL approved = [raw hasPrefix:@\"\
        id.video.\"] && raw.length <= 96;\n                if (approved) {\n                    NSCharacterSet *bad\
        \ = [[NSCharacterSet characterSetWithCharactersInString:\n                        @\"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._-\"\
        ] invertedSet];\n                    approved = [raw rangeOfCharacterFromSet:bad].location == NSNotFound;\n\
        \                    NSArray *parts = [raw componentsSeparatedByString:@\".\"];\n                    approved\
        \ = approved && parts.count >= 3 && parts.count <= 6;\n                    for (NSString *part in parts)\
        \ if (part.length > 32 || part.length == 0) approved = NO;\n                }\n                if (approved)\
        \ {\n                    NSMutableArray *stored = [[d arrayForKey:@\"RYDV7IdentifierList\"] mutableCopy];\n\
        \                    if (!stored) stored = [NSMutableArray array];\n                    if (![stored containsObject:raw]\
        \ && stored.count < 12) {\n                        [stored addObject:raw];\n                        [d setObject:stored\
        \ forKey:@\"RYDV7IdentifierList\"];\n                    }\n                    NSString *shape = [NSString\
        \ stringWithFormat:@\"node=%@, children=%lu\",\n                        node ? @\"yes\" : @\"no\", (unsigned\
        \ long)[node.yogaChildren count]];\n                    [d setObject:shape forKey:[@\"RYDV7Shape_\" stringByAppendingString:raw]];\n\
        \                } else {\n                    [d setInteger:[d integerForKey:@\"RYDV7Redacted\"] + 1 forKey:@\"\
        RYDV7Redacted\"];\n                }\n            }\n            [d setInteger:rydV7Observed forKey:@\"\
        RYDV7TotalSeen\"];\n        }\n    }\n'''\nt = replace_once(t, v6_entry + v6_code, v6_entry + v6_code +\
        \ v7_code,\n    'v7 scoped identifier collection')\n# v8: inspect only the *structure* of bounded node trees.\
        \ Never store\n# unredacted accessibility identifiers, video IDs, labels or text.\nv8_code = r'''\n    static\
        \ NSUInteger rydV8Roots = 0;\n    static NSUInteger rydV8Budget = 0;\n    if (rydV8Roots < 500 && rydV8Budget\
        \ < 5000 && node != nil) {\n        rydV8Roots++;\n        NSMutableArray *pending = [NSMutableArray arrayWithObject:@[node,\
        \ @(0)]];\n        NSUInteger scanned = 0;\n        BOOL sawLike = NO;\n        BOOL sawDislike = NO;\n\
        \        BOOL sawAction = NO;\n        BOOL sawRolling = NO;\n        NSUInteger bestDepth = 0;\n      \
        \  NSString *bestClass = @\"none\";\n        while (pending.count > 0 && scanned < 80 && rydV8Budget < 5000)\
