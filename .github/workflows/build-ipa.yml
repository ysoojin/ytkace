          from pathlib import Path
          import shutil, subprocess, sys, tempfile
          key, path, dest = sys.argv[1:]
          packages = sorted((Path(path)/'packages').glob('*.deb'))
          if len(packages) != 1:
              sys.exit(f'{key}: expected 1 DEB, found {len(packages)}')
          package = packages[0]
          subprocess.run(['dpkg-deb', '--info', str(package)], stdout=subprocess.DEVNULL, check=True)
          with tempfile.TemporaryDirectory() as temp:
              subprocess.run(['dpkg-deb', '-x', str(package), temp], check=True)
              files = [f for f in Path(temp).rglob('*.dylib')
                       if f.is_file() and not any(part.lower().endswith('.dsym') for part in f.parts)]
              if not files:
                  sys.exit(f'{key}: DEB contains no loadable dylib candidate')
              for lib in files:
                  data = lib.read_bytes()
                  if b'CydiaSubstrate.framework/CydiaSubstrate' in data:
                      print(f'RUNTIME WARNING [{key}]: {lib.name} references CydiaSubstrate; ensure the IPA/runtime can resolve it')
          target = Path(dest)/(key + '.deb')
          if target.exists():
              sys.exit(f'{key}: duplicate output')
          shutil.copy2(package, target)
          print('READY DEB:', key, target)
          PY_DEB
