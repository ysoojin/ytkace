name: IPA (YTKACE + optional RYD)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct URL of decrypted YouTube IPA
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: Add Return YouTube Dislikes (experimental)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ytkace:
    uses: ./.github/workflows/build-deb.yml

  ryd:
    if: ${{ inputs.add_ryd }}
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: PoomSmart/Return-YouTube-Dislikes
          path: extra-src
          submodules: recursive
      - name: Install Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install RYD header dependencies
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/include"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          test -f "$THEOS/include/PSHeader/Misc.h"
          test -f "$THEOS/include/YouTubeHeader/YTLikeStatus.h"
      - name: Build RYD rootless package
        working-directory: extra-src
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: Extra-RYD-deb
          path: extra-src/packages/*.deb
          if-no-files-found: error

  package:
    needs: [ytkace, ryd]
    if: ${{ always() && needs.ytkace.result == 'success' && (needs.ryd.result == 'success' || needs.ryd.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: packages
      - uses: actions/download-artifact@v8
        if: ${{ inputs.add_ryd }}
        with:
          name: Extra-RYD-deb
          path: extra-packages
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'URL did not return a valid IPA/ZIP'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(x.startswith('Payload/') and x.endswith('.app/Info.plist') for x in z.namelist()), 'Missing app Info.plist'
          PY
      - name: Inject YTKACE and optional RYD
        id: inject
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
        run: |
          set -euo pipefail
          mkdir -p deb-root
          dpkg-deb -x "$(find packages -maxdepth 1 -name '*.deb' | head -1)" deb-root
          ytkace="$(find deb-root -name YTKACE.dylib -print -quit)"
          test -n "$ytkace"
          export LDID="$(brew --prefix)/bin/ldid"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info=next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PY
          )"
          output="YTKACE_${version}_YouTube_${youtube_version}.ipa"
          bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" stage-ytkace.ipa
          bash Tools/verify-artifacts.sh "$ytkace" stage-ytkace.ipa
          if [ "$ADD_RYD" = 'true' ]; then
            mkdir -p extra-root
            dpkg-deb -x "$(find extra-packages -maxdepth 1 -name '*.deb' | head -1)" extra-root
            count="$(find extra-root -type f -name '*.dylib' | wc -l | tr -d ' ')"
            if [ "$count" -ne 1 ]; then
              echo "Expected one RYD dylib; found $count. Review dependencies before injection." >&2
              exit 1
            fi
            extra="$(find extra-root -type f -name '*.dylib' -print -quit)"
            bash Scripts/sideload-repack.sh stage-ytkace.ipa "$extra" "$output"
            bash Tools/verify-artifacts.sh "$extra" "$output"
            # Check YTKACE remains in the repacked IPA too.
            python3 - "$output" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert any(n.endswith('YTKACE.dylib') for n in z.namelist()), 'Second injection removed YTKACE.dylib'
          PY
          else
            mv stage-ytkace.ipa "$output"
          fi
          echo "ipa=$output" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-IPA-single
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error
