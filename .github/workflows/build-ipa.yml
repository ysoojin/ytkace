name: IPA (YTKACE built-in RYD for Shorts/details + v10.17 main counts 30s)
'on':
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct URL to your decrypted YouTube IPA (required; no default)
        required: true
        type: string
        default: ''
      ytkace_ref:
        description: 'Official YTKACE release: latest or tag (e.g. v1.1.7)'
        required: true
        type: string
        default: v1.1.8
      add_ryd:
        description: 'Extra RYD: regular-video button counts, 30s refresh (default ON)'
        type: boolean
        default: true
      ryd_diagnostics:
        description: 'Patch extra RYD: disable Shorts/details duplicate; enable 30s labels (ON)'
        type: boolean
        default: true
      add_ytuhd:
        description: YTUHD (default OFF)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig (default OFF)
        type: boolean
        default: false
      add_ytbackgroundonly:
        description: YTBackgroundOnly - background audio and continue-watching bypass (default OFF)
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote (default OFF)
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent (untested; default OFF)
        type: boolean
        default: false
      add_youmute:
        description: YouMute + required YTVideoOverlay (default OFF)
        type: boolean
        default: false
      add_yougroupsettings:
        description: YouGroupSettings grouped tweak settings (default OFF)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  ytkace:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Resolve official YTKACE release
      id: ytkace_release
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_REF: ${{ inputs.ytkace_ref }}
      shell: bash
      run: "set -euo pipefail\nif [[ \"$REQUESTED_REF\" == latest ]]; then\n  tag=\"$(gh api repos/itzzace/ytkace/releases/latest\
        \ --jq '.tag_name')\"\nelse\n  tag=\"$REQUESTED_REF\"\n  [[ \"$tag\" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] ||\
        \ { echo '::error::Use latest or vX.Y.Z release tag'; exit 1; }\n  gh api \"repos/itzzace/ytkace/releases/tags/$tag\"\
        \ --jq '.tag_name' >/dev/null\nfi\ntest -n \"$tag\"\necho \"tag=$tag\" >> \"$GITHUB_OUTPUT\"\necho \"Official\
        \ YTKACE release: $tag\"\n"
    - uses: actions/checkout@v6
      with:
        repository: itzzace/ytkace
        ref: ${{ steps.ytkace_release.outputs.tag }}
        path: upstream-ytkace
        submodules: recursive
    - name: Install Theos
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
    - name: Build YTKACE Rootless DEB and extract shipped library
      shell: bash
      run: "set -euo pipefail\n# Theos installer can leave incompatible Clang precompiled modules.\n# Isolate this\
        \ run's module cache and avoid parallel module rebuild races.\nrm -rf \"${HOME}/.cache/clang/ModuleCache\"\
        \ \"${THEOS}/obj\"\nexport CLANG_MODULE_CACHE_PATH=\"${RUNNER_TEMP}/ytkace-clang-modules-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\
        \nmkdir -p \"$CLANG_MODULE_CACHE_PATH\"\n(cd upstream-ytkace && make clean && make -j1 package FINALPACKAGE=1\
        \ THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1)\nmkdir -p built-ytkace built-deb extracted\n\
        printf '%s\\n' \"${{ steps.ytkace_release.outputs.tag }}\" > built-ytkace/ytkace-tag.txt\nshopt -s nullglob\n\
        packages=(upstream-ytkace/packages/*.deb)\nif (( ${#packages[@]} != 1 )); then\n  echo \"Expected exactly\
        \ one Rootless DEB, found ${#packages[@]}\" >&2\n  exit 1\nfi\nversion=\"$(dpkg-deb --field \"${packages[0]}\"\
        \ Version)\"\ntest -n \"$version\"\nprintf '%s\\n' \"$version\" > built-ytkace/ytkace-version.txt\necho\
        \ \"YTKACE package actual version: $version\"\ndeb=\"built-deb/com.itzzace.ytkace_${version}_rootless.deb\"\
        \ncp \"${packages[0]}\" \"$deb\"\ndpkg-deb --extract \"$deb\" extracted\npython3 - <<'PY_YTKACE'\nfrom pathlib\
        \ import Path\nimport shutil, struct, sys\nlibs=[p for p in Path('extracted').rglob('YTKACE.dylib') if p.is_file()]\n\
        if len(libs)!=1:\n    sys.exit(f'Expected exactly one YTKACE.dylib in DEB, found: {libs}')\np=libs[0]\n\
        with p.open('rb') as f:\n    magic=f.read(4)\n    endian={b'\\xfe\\xed\\xfa\\xce':'>',b'\\xce\\xfa\\xed\\\
        xfe':'<',b'\\xfe\\xed\\xfa\\xcf':'>',b'\\xcf\\xfa\\xed\\xfe':'<'}\n    if magic not in endian:\n       \
        \ sys.exit(f'YTKACE is not thin Mach-O: {p}; magic={magic.hex()}')\n    f.seek(12)\n    kind=struct.unpack(endian[magic]+'I',f.read(4))[0]\n\
        \    if kind!=6:\n        sys.exit(f'YTKACE library has Mach-O type {kind}, expected MH_DYLIB (6): {p}')\n\
        shutil.copy2(p,'built-ytkace/YTKACE.dylib')\nprint('Using packaged real YTKACE library:',p)\nPY_YTKACE\n"
    - uses: actions/upload-artifact@v7
      with:
        name: YTKACE-library
        path: built-ytkace/
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: YTKACE-deb-rootless
        path: built-deb/*.deb
        if-no-files-found: error
  package:
    needs: ytkace
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: YTKACE-library
        path: built-ytkace
    - name: Download YTKACE Rootless DEB for single-pass cyan
      uses: actions/download-artifact@v8
      with:
        name: YTKACE-deb-rootless
        path: built-deb
    - name: Fetch matching official YTKACE packaging assets
      shell: bash
      run: 'set -euo pipefail

        tag="$(cat built-ytkace/ytkace-tag.txt)"

        version="$(cat built-ytkace/ytkace-version.txt)"

        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

        test -n "$version"

        git clone --depth 1 --branch "$tag" https://github.com/itzzace/ytkace.git ytkace-upstream

        source_version="$(awk ''/^Version:/ {print $2}'' ytkace-upstream/control)"

        [[ "$source_version" == "$version" ]] || { echo "::error::YTKACE source ($source_version) and built package
        ($version) do not match"; exit 1; }

        test -f ytkace-upstream/Scripts/sideload-repack.sh

        test -f ytkace-upstream/Tools/verify-artifacts.sh

        echo "YTKACE source and IPA packaging both use $tag ($version)" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Install IPA signing tool
      run: brew install ldid
    - name: Install optional DEB and cyan tools
      if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_ytsilentvote || inputs.add_donteatmycontent
        || inputs.add_youmute || inputs.add_yougroupsettings || inputs.add_ytbackgroundonly }}
      run: 'set -euo pipefail

        brew install dpkg

        pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

        command -v dpkg-deb

        command -v cyan

        cyan --help >/dev/null

        '
    - name: Install Theos for selected tweaks
      if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_ytsilentvote || inputs.add_donteatmycontent
        || inputs.add_youmute || inputs.add_yougroupsettings || inputs.add_ytbackgroundonly }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

        '
    - name: Prepare YTABConfig Mix post-hook defaults (editable)
      if: ${{ inputs.add_ytabconfig }}
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/patch-ytabc-mix.py" <<'PY_YTABC_MIX'
        from pathlib import Path
        import re, sys
        root = Path(sys.argv[1])
        settings, tweak = root / 'Settings.x', root / 'Tweak.x'
        s, t = settings.read_text(), tweak.read_text()
        def once(source, old, new, label):
            if source.count(old) != 1:
                raise SystemExit('YTABConfig Mix post-hook: upstream mismatch: ' + label)
            return source.replace(old, new, 1)
        # Only run after all three upstream hookClass calls have returned.
        # Use the native UI setter, which takes cacheMutex itself.
        anchor = 'static void setValueFromImport(NSString *settingKey, BOOL value) {'
        helper = r'''// Initial defaults only: users can still edit the two flags afterwards.
        void YTABCApplyMixDefaultsAfterHooks(void) {
            NSArray<NSString *> *targets = @[
                @"queueClientGlobalConfigIosEnablePlaylistEntryPointFab",
                @"queueClientGlobalConfigIosEnableQueuePhase4V2"
            ];
            NSMutableArray<NSArray<NSString *> *> *matches = [NSMutableArray array];
            pthread_mutex_lock(&cacheMutex);
            for (NSString *classKey in cache) {
                for (NSString *method in cache[classKey]) {
                    for (NSString *target in targets) {
                        if ([method caseInsensitiveCompare:target] == NSOrderedSame) {
                            [matches addObject:@[classKey, method]];
                            break;
                        }
                    }
                }
            }
            pthread_mutex_unlock(&cacheMutex);
            // Never call setValue or getKey while holding cacheMutex.
            NSMutableSet<NSString *> *found = [NSMutableSet set];
            for (NSArray<NSString *> *pair in matches) {
                NSString *classKey = pair[0], *method = pair[1];
                NSString *marker = [NSString stringWithFormat:@"YTKACEMixPostHookV3.%@.%@", classKey, method];
                if (![defaults boolForKey:marker]) {
                    setValue(method, classKey, NO);
                    [defaults setBool:YES forKey:marker];
                }
                [found addObject:method.lowercaseString];
            }
            updateAllKeys();
            for (NSArray<NSString *> *pair in matches) {
                NSLog(@"[YTABC-MixPostHook-v3] %@.%@ = %d", pair[0], pair[1], (int)getValue(getKey(pair[1], pair[0])));
            }
            NSLog(@"[YTABC-MixPostHook-v3] recognized %lu/2 target flags", (unsigned long)found.count);
        }

        '''
        s = once(s, anchor, 'void updateAllKeys(void);\n' + helper + anchor, 'native setter location')
        t = once(t, 'extern BOOL getValue(NSString *methodKey);',
                 'extern BOOL getValue(NSString *methodKey);\nextern void YTABCApplyMixDefaultsAfterHooks(void);', 'declaration')
        # Anchor to the real enabled launch path, not a guessed config class.
        pattern = r'(hookClass\(globalConfig\);\s*hookClass\(coldConfig\);\s*hookClass\(hotConfig\);)'
        if len(re.findall(pattern, t)) != 1:
            raise SystemExit('YTABConfig Mix post-hook: launch hook sequence not found')
        t = re.sub(pattern, r'\1\n        YTABCApplyMixDefaultsAfterHooks();', t, count=1)
        settings.write_text(s)
        tweak.write_text(t)
        print('YTABConfig Mix post-hook: native setter, outside lock, editable OFF defaults')
        PY_YTABC_MIX
    - name: Build selected tweak DEBs together (no individual artifacts)
      env:
        ADD_RYD: ${{ inputs.add_ryd }}
        RYD_DIAGNOSTICS: ${{ inputs.ryd_diagnostics }}
        ADD_YTUHD: ${{ inputs.add_ytuhd }}
        ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
        ADD_YTBACKGROUNDONLY: ${{ inputs.add_ytbackgroundonly }}
        ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
        ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
        ADD_YOUMUTE: ${{ inputs.add_youmute }}
        ADD_YOUGROUPSETTINGS: ${{ inputs.add_yougroupsettings }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p extra-debs sources
        : > selected-success.txt
        : > selected-failed.txt
        : > requested-tweaks.txt
        for pair in "ryd:$ADD_RYD" "ytuhd:$ADD_YTUHD" "ytabconfig:$ADD_YTABCONFIG" "ytbackgroundonly:$ADD_YTBACKGROUNDONLY" "ytsilentvote:$ADD_YTSILENTVOTE" "donteatmycontent:$ADD_DONTEATMYCONTENT" "youmute:$ADD_YOUMUTE" "yougroupsettings:$ADD_YOUGROUPSETTINGS"; do
          if [[ "${pair##*:}" == true ]]; then printf '%s\n' "${pair%%:*}" >> requested-tweaks.txt; fi
        done
        # Optional tweak build failures are reported, not fatal.
        mkdir -p "$THEOS/include"
        git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader" || echo 'WARN: PSHeader unavailable (some tweaks may fail)'
        git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader" || echo 'WARN: YouTubeHeader unavailable (some tweaks may fail)'
        if [[ "$ADD_YTUHD" == true ]]; then
          brew install meson ninja pkg-config autoconf automake libtool nasm yasm || echo 'WARN: YTUHD build tools setup failed'
        fi

        build_one() {
          local key="$1" repo="$2" flag="$3" out="sources/$1"
          [[ "$flag" == true ]] || return 0
          echo "::group::Building optional tweak $key"
          if ! git clone --depth 1 --recurse-submodules "https://github.com/$repo.git" "$out"; then
            echo "FAILED $key: git clone" | tee -a selected-failed.txt
            echo '::endgroup::'
            return 0
          fi
          if [[ "$key" == ytabconfig ]]; then
            if ! python3 "$RUNNER_TEMP/patch-ytabc-mix.py" "$out"; then
              echo "FAILED $key: Mix default OFF patch failed; refusing unpatched YTABConfig" | tee -a selected-failed.txt
              echo '::endgroup::'
              return 0
            fi
          fi
          # RYD upstream filters only the stock bundle ID. Sideload signing
          # may change CFBundleIdentifier, preventing Substrate from loading
          # an otherwise correctly injected dylib. Match the executable
          # instead, which remains "YouTube" for this IPA build.
          if [[ "$key" == ytbackgroundonly ]]; then
            python3 - "$out" <<'PY_YTBACKGROUND_FILTER'
        from pathlib import Path
        import plistlib, sys
        path = Path(sys.argv[1]) / 'YTBackgroundOnly.plist'
        if not path.is_file():
            sys.exit('YTBackgroundOnly: upstream loader plist missing')
        try:
            original = plistlib.loads(path.read_bytes())
        except Exception as exc:
            sys.exit(f'YTBackgroundOnly: cannot parse upstream plist: {exc}')
        old_filter = original.get('Filter')
        if not isinstance(old_filter, dict) or old_filter.get('Bundles') != ['com.google.ios.youtube']:
            sys.exit('YTBackgroundOnly: upstream filter changed; refusing unsafe patch')
        path.write_bytes(plistlib.dumps({'Filter': {'Executables': ['YouTube']}}, fmt=plistlib.FMT_XML))
        assert plistlib.loads(path.read_bytes())['Filter']['Executables'] == ['YouTube']
        print('YTBackgroundOnly sideload filter: Executables = YouTube')
        PY_YTBACKGROUND_FILTER
          fi
          if [[ "$key" == ryd ]]; then
            python3 - "$out" <<'PY_RYD_FILTER'
        from pathlib import Path
        import plistlib, sys
        root = Path(sys.argv[1])
        p = root / 'YouTubeDislikesReturn.plist'
        if not p.is_file():
            sys.exit('RYD filter plist missing: ' + str(p))
        # The upstream file uses OpenStep syntax; write a standard XML plist
        # understood by Substrate/Cyan. Only change the loader filter.
        original = p.read_text()
        if 'com.google.ios.youtube' not in original or 'Filter' not in original:
            sys.exit('Unexpected RYD filter contents; refusing blind patch')
        p.write_bytes(plistlib.dumps({'Filter': {'Executables': ['YouTube']}}, fmt=plistlib.FMT_XML))
        print('RYD sideload filter: Executables = YouTube (bundle-ID independent)')
        PY_RYD_FILTER
          fi
          if [[ "$key" == ryd && "$RYD_DIAGNOSTICS" == true ]]; then
            python3 - "$out" <<'PY_RYD_DIAGNOSTIC'
        from pathlib import Path
        import sys
        root = Path(sys.argv[1])
        api = root / 'API.x'
        tweak = root / 'Tweak.x'
        if not api.is_file() or not tweak.is_file():
            sys.exit('RYD diagnostics: required upstream sources not found')
        a = api.read_text()
        t = tweak.read_text()
        def replace_once(source, old, new, label):
            if source.count(old) != 1:
                sys.exit(f'RYD diagnostics: upstream changed ({label}); cannot safely instrument')
            return source.replace(old, new, 1)
        # No video ID, URL, vote data, or account identifiers are printed.
        a = replace_once(a,
            'NSUInteger responseCode = [httpResponse statusCode];',
            'NSUInteger responseCode = [httpResponse statusCode];\n    NSLog(@"[RYD-DIAG] API HTTP status=%lu networkError=%d", (unsigned long)responseCode, error != nil);',
            'API status')
        a = replace_once(a,
            'dispatch_async(dispatch_get_main_queue(), ^{\n            dataHandler(myData);',
            'NSLog(@"[RYD-DIAG] API JSON parsed successfully");\n        dispatch_async(dispatch_get_main_queue(), ^{\n            dataHandler(myData);',
            'API JSON callback')
        t = replace_once(t,
            '    YTQTMButton *dislikeButton = self.dislikeButton;',
            '    NSLog(@"[RYD-DIAG] Shorts like/dislike hook invoked");\n    YTQTMButton *dislikeButton = self.dislikeButton;',
            'Shorts hook')
        t = replace_once(t,
            '    getVoteFromVideoWithHandler(cache, videoId, maxRetryCount, ^(NSDictionary *data, NSString *error) {',
            '    NSLog(@"[RYD-DIAG] Requesting vote data from UI hook");\n    getVoteFromVideoWithHandler(cache, videoId, maxRetryCount, ^(NSDictionary *data, NSString *error) {',
            'general video request hook')
        t = replace_once(t,
            '        HBLogDebug(@"RYD: Vote data for video %@: %@", videoId, data);',
            '        NSLog(@"[RYD-DIAG] UI vote callback hasData=%d hasError=%d", data != nil, error != nil);',
            'general video callback')
        api.write_text(a)
        tweak.write_text(t)
        # Keep private values (video IDs, user IDs, URLs, responses) out of diagnostics.
        # NSUserDefaults is read by the diagnostic entry in the RYD settings screen.
        def append_marker(text, old, replacement, label):
            if text.count(old) != 1:
                sys.exit(f'RYD on-device diagnostics: upstream mismatch ({label})')
            return text.replace(old, replacement, 1)
        a = append_marker(a,
            'NSLog(@"[RYD-DIAG] API HTTP status=%lu networkError=%d", (unsigned long)responseCode, error != nil);',
            'NSLog(@"[RYD-DIAG] API HTTP status=%lu networkError=%d", (unsigned long)responseCode, error != nil);'
            '\n    [[NSUserDefaults standardUserDefaults] setObject:[NSString stringWithFormat:@"HTTP %lu, networkError=%d", (unsigned long)responseCode, error != nil] forKey:@"RYDDiagHTTP"];',
            'api http marker')
        a = append_marker(a,
            'NSLog(@"[RYD-DIAG] API JSON parsed successfully");',
            'NSLog(@"[RYD-DIAG] API JSON parsed successfully");'
            '\n        [[NSUserDefaults standardUserDefaults] setObject:@"JSON parsed OK" forKey:@"RYDDiagJSON"];',
            'api data marker')
        t = append_marker(t,
            'NSLog(@"[RYD-DIAG] Shorts like/dislike hook invoked");',
            'NSLog(@"[RYD-DIAG] Shorts like/dislike hook invoked");'
            '\n    [[NSUserDefaults standardUserDefaults] setObject:@"Shorts hook called" forKey:@"RYDDiagShorts"];',
            'shorts marker')
        t = append_marker(t,
            'NSLog(@"[RYD-DIAG] Requesting vote data from UI hook");',
            'NSLog(@"[RYD-DIAG] Requesting vote data from UI hook");'
            '\n    [[NSUserDefaults standardUserDefaults] setObject:@"Video UI requested votes" forKey:@"RYDDiagVideo"];',
            'video marker')
        t = append_marker(t,
            'NSLog(@"[RYD-DIAG] UI vote callback hasData=%d hasError=%d", data != nil, error != nil);',
            'NSLog(@"[RYD-DIAG] UI vote callback hasData=%d hasError=%d", data != nil, error != nil);'
            '\n        [[NSUserDefaults standardUserDefaults] setObject:[NSString stringWithFormat:@"hasData=%d, hasError=%d", data != nil, error != nil] forKey:@"RYDDiagCallback"];',
            'callback marker')
        # v5: observe upstream hook ENTRY before layout / video-ID filtering.
        # This distinguishes missing hook invocation from a changed UI layout.
        # No actual IDs, counts, media metadata, or account values are recorded.
        early_anchor = '- (ELMCellNode *)nodeForItemAtIndexPath:(NSIndexPath *)indexPath {'
        t = replace_once(t, early_anchor, early_anchor + r'''
            static BOOL rydDidRecordCollection = NO;
            static BOOL rydDidRecordActionCollection = NO;
            if (!rydDidRecordCollection) {
                rydDidRecordCollection = YES;
                [[NSUserDefaults standardUserDefaults] setObject:@"호출됨" forKey:@"RYDPathCollectionEntry"];
            }
            NSString *rydCollectionId = self.accessibilityIdentifier;
            if (!rydDidRecordActionCollection &&
                [rydCollectionId containsString:@"video"] &&
                [rydCollectionId containsString:@"action_bar"]) {
                rydDidRecordActionCollection = YES;
                // Log a fixed label, not arbitrary identifiers from view data.
                NSString *kind = [rydCollectionId isEqualToString:@"id.video.scrollable_action_bar"]
                    ? @"기존 scrollable_action_bar"
                    : ([rydCollectionId isEqualToString:@"id.video.non_scrollable_action_bar"]
                        ? @"non_scrollable_action_bar" : @"다른 video action_bar");
                [[NSUserDefaults standardUserDefaults] setObject:kind forKey:@"RYDPathActionKind"];
            }
        ''' , 'ASCollectionView entry')
        # The upstream matching function uses one literal ID; record whether
        # this branch is reached before any potentially fragile tree traversal.
        t = replace_once(t,
            'else if (isVideoScrollableActionBar(self, node)) {',
            'else if (isVideoScrollableActionBar(self, node)) {\n        [[NSUserDefaults standardUserDefaults] setObject:@"진입함" forKey:@"RYDPathActionBranch"];',
            'regular action bar branch')
        # Use a hook that v4 proved exists; do not guess signatures for
        # YTReelWatchLikesController's newly named methods.
        shorts_anchor = '%hook YTReelWatchPlaybackOverlayView\n'
        if t.count(shorts_anchor) != 1:
            sys.exit('v5: overlay class hook changed')
        begin, after = t.split(shorts_anchor, 1)
        method_anchor = '- (void)layoutActionBar {'
        if after.count(method_anchor) < 1:
            sys.exit('v5: overlay layoutActionBar missing')
        after = after.replace(method_anchor, method_anchor + r'''
            static BOOL rydDidRecordShortOverlay = NO;
            if (!rydDidRecordShortOverlay) {
                rydDidRecordShortOverlay = YES;
                [[NSUserDefaults standardUserDefaults] setObject:@"호출됨" forKey:@"RYDPathShortOverlay"];
            }
        ''', 1)
        t = begin + shorts_anchor + after
        # v6: capture a bounded, privacy-safe distribution of collection IDs
        # and ELM node structure without recording raw identifiers or videos.
        # This occurs before the strict upstream action-bar ID check.
        v6_entry = 'ELMCellNode *node = %orig;'
        v6_code = r'''
            static NSUInteger rydV6Seen = 0;
            if (rydV6Seen < 400) {
                rydV6Seen++;
                NSString *tag = self.accessibilityIdentifier;
                NSString *bucket = @"other";
                if (tag.length == 0) bucket = @"empty";
                else if ([tag isEqualToString:@"id.video.scrollable_action_bar"]) bucket = @"old-scrollable";
                else if ([tag isEqualToString:@"id.video.non_scrollable_action_bar"]) bucket = @"new-nonscrollable";
                else if ([tag containsString:@"action_bar"]) bucket = @"other-actionbar";
                else if ([tag containsString:@"video"]) bucket = @"other-video";
                NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                NSString *key = [@"RYDV6Bucket_" stringByAppendingString:bucket];
                [defaults setInteger:([defaults integerForKey:key] + 1) forKey:key];
                // Record only the structural shape, not user-visible data.
                if ([bucket isEqualToString:@"new-nonscrollable"] ||
                    [bucket isEqualToString:@"other-actionbar"] ||
                    [bucket isEqualToString:@"old-scrollable"]) {
                    NSString *shapeKey = [@"RYDV6Shape_" stringByAppendingString:bucket];
                    if (![defaults objectForKey:shapeKey]) {
                        [defaults setObject:[NSString stringWithFormat:@"node=%@ children=%lu",
                            node ? @"yes" : @"no", (unsigned long)[node.yogaChildren count]] forKey:shapeKey];
                    }
                }
                [defaults setInteger:rydV6Seen forKey:@"RYDV6TotalSeen"];
            }
        '''
        t = replace_once(t, v6_entry, v6_entry + v6_code, 'v6 collection telemetry entry')
        # v7 runs independently from v6's 400-call limit. Only publish
