name: IPA (YTKACE + selectable tweaks)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Decrypted YouTube IPA URL
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: Return YouTube Dislikes
        type: boolean
        default: true
      add_ytuhd:
        description: YTUHD 4K (macOS library build; experimental)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig
        type: boolean
        default: false
      add_youquality:
        description: YouQuality
        type: boolean
        default: false
      add_youslider:
        description: YouSlider
        type: boolean
        default: false
      add_youmute:
        description: YouMute
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent (duplicate symbol fix)
        type: boolean
        default: false
      add_yougetcaption:
        description: YouGetCaption
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  ytkace:
    uses: ./.github/workflows/build-deb.yml

  extra-tweaks:
    runs-on: ${{ inputs.add_ytuhd && 'macos-15' || 'ubuntu-24.04' }}
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Show runner and selected options
        env:
          ADD_YTUHD: ${{ inputs.add_ytuhd }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
        run: |
          echo "runner=$RUNNER_OS ytuhd=$ADD_YTUHD dontEat=$ADD_DONTEATMYCONTENT"
          if [[ "$ADD_YTUHD" == 'true' && "$RUNNER_OS" != 'macOS' ]]; then
            echo 'YTUHD requires macOS runner' >&2
            exit 1
          fi

      - name: Install build tools for YTUHD
        if: ${{ inputs.add_ytuhd }}
        run: |
          set -euo pipefail
          brew install meson ninja pkg-config autoconf automake libtool nasm yasm
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Install shared headers
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/include"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          test -f "$THEOS/include/PSHeader/Misc.h"
          test -f "$THEOS/include/YouTubeHeader/YTLikeStatus.h"

      - name: Build selected tweaks
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
          ADD_YTUHD: ${{ inputs.add_ytuhd }}
          ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
          ADD_YOUQUALITY: ${{ inputs.add_youquality }}
          ADD_YOUSLIDER: ${{ inputs.add_youslider }}
          ADD_YOUMUTE: ${{ inputs.add_youmute }}
          ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
          ADD_YOUGETCAPTION: ${{ inputs.add_yougetcaption }}
        run: |
          set -euo pipefail
          mkdir -p extra-built sources

          build_tweak() {
            local key="$1" repo="$2" flag="$3"
            if [[ "$flag" != true ]]; then
              echo "SKIP $key"
              return
            fi
            echo "Building $key from $repo"
            local checkout="sources/$key"
            if [[ "$key" == ytvideooverlay ]]; then
              checkout="sources/YTVideoOverlay"
            fi
            git clone --depth 1 --recurse-submodules "https://github.com/${repo}.git" "$checkout"
            pushd "$checkout"

            if [[ "$key" == donteatmycontent ]]; then
              # Tweak.h defines a global that is compiled into two .o files.
              # Keep one definition in Tweak.x; declare it extern in Tweak.h.
              python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('Tweak.h')
          s = p.read_text()
          before = 'CGFloat constant;'
          assert s.count(before) == 1, 'Unexpected upstream Tweak.h; do not patch blindly'
          p.write_text(s.replace(before, 'extern CGFloat constant;', 1))
          t = Path('Tweak.x')
          t_src = t.read_text()
          marker = '#import "Tweak.h"'
          assert marker in t_src, 'Unexpected Tweak.x imports'
          t.write_text(t_src.replace(marker, marker + '\nCGFloat constant;', 1))
          PYFIX
            fi

            make clean || true
            if [[ "$key" == ytuhd ]]; then
              test -d vendor/libvpx
              test -d vendor/dav1d
              git submodule update --init --recursive
              make libvpx
              make dav1d
              test -f vendor/libvpx_ios/libvpx.a
              test -f vendor/dav1d_ios/libdav1d.a
              make package SIDELOAD=1 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
            else
              make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
            fi
            deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
            test -n "$deb" || { echo "No DEB from $key" >&2; exit 1; }
            cp "$deb" "../../extra-built/${key}.deb"
            popd
          }

          if [[ "$ADD_YOUQUALITY" == true || "$ADD_YOUMUTE" == true ]]; then
            build_tweak ytvideooverlay PoomSmart/YTVideoOverlay true
          fi
          build_tweak ryd PoomSmart/Return-YouTube-Dislikes "$ADD_RYD"
          build_tweak ytuhd PoomSmart/YTUHD "$ADD_YTUHD"
          build_tweak ytabconfig PoomSmart/YTABConfig "$ADD_YTABCONFIG"
          build_tweak youquality PoomSmart/YouQuality "$ADD_YOUQUALITY"
          build_tweak youslider PoomSmart/YouSlider "$ADD_YOUSLIDER"
          build_tweak youmute PoomSmart/YouMute "$ADD_YOUMUTE"
          build_tweak ytsilentvote PoomSmart/YTSilentVote "$ADD_YTSILENTVOTE"
          build_tweak donteatmycontent therealFoxster/DontEatMyContent "$ADD_DONTEATMYCONTENT"
          build_tweak yougetcaption PoomSmart/YouGetCaption "$ADD_YOUGETCAPTION"
          printf 'Selected tweak packages.\n' > extra-built/README.txt
          find extra-built -maxdepth 1 -name '*.deb' -print | sort

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-selected-extra-debs
          path: extra-built/
          if-no-files-found: error

  package:
    needs: [ytkace, extra-tweaks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-selected-extra-debs
          path: extra-packages
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PYVALIDATE'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'Not a valid IPA/ZIP'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist') for n in z.namelist())
          PYVALIDATE
      - name: Inject YTKACE and selected tweaks
        id: inject
        run: |
          set -euo pipefail
          mkdir -p deb-root
          dpkg-deb -x "$(find packages -maxdepth 1 -name '*.deb' -print -quit)" deb-root
          ytkace="$(find deb-root -name YTKACE.dylib -print -quit)"
          test -n "$ytkace"
          export LDID="$(brew --prefix)/bin/ldid"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PYVERSION'
          import plistlib, zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info = next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PYVERSION
          )"
          output="YouTube_${youtube_version}_YTKACE_${version}.ipa"
          mkdir -p extra-root
          # Extract all selected tweaks first; no library is injected until vetted.
          shopt -s nullglob
          for deb in extra-packages/*.deb; do
            key="$(basename "$deb" .deb)"
            mkdir -p "extra-root/$key"
            dpkg-deb -x "$deb" "extra-root/$key"
          done
          # Scan Mach-O load commands and reject jailbreak-only dependencies.
          # Repeat the check for tweaks that depend on an excluded tweak.
          python3 - "$ytkace" <<'PYFILTER'
          from pathlib import Path
          import subprocess, sys

          libs = sorted(Path('extra-root').rglob('*.dylib'))
          libs = [p for p in libs if p.is_file()]
          if len(libs) != len({p.name for p in libs}):
              raise SystemExit('Duplicate dylib basenames; refusing ambiguous injection')

          def dependencies(path):
              result = subprocess.run(['otool', '-L', str(path)],
                                      capture_output=True, text=True, check=True)
              lines = result.stdout.splitlines()[1:]
              return [line.strip().split(' (compatibility version', 1)[0]
                      .split(' (current version', 1)[0]
                      for line in lines if line.strip()]

          forbidden = ('cydiasubstrate', 'mobilesubstrate', 'libsubstrate',
                       'libhooker', '/substitute', 'substitute.dylib')
          def unsupported(dep):
              name = dep.lower()
              return any(word in name for word in forbidden)

          base = Path(sys.argv[1])
          base_bad = [d for d in dependencies(base) if unsupported(d)]
          if base_bad:
              raise SystemExit('YTKACE itself requires jailbreak libraries: ' +
                               ', '.join(base_bad))
          deps = {p.name: dependencies(p) for p in libs}
          excluded = {}
          for name, items in deps.items():
              bad = [d for d in items if unsupported(d)]
              if bad:
                  excluded[name] = 'jailbreak dependency: ' + ', '.join(bad)

          # Reject downstream dependents whenever a required dylib was removed.
          changed = True
          while changed:
              changed = False
              for name, items in deps.items():
                  if name in excluded:
                      continue
                  for dep in items:
                      required = dep.rsplit('/', 1)[-1]
                      if required in excluded:
                          excluded[name] = 'depends on excluded ' + required
                          changed = True
                          break

          # Fail safely for direct non-system @rpath dependencies missing from
          # both the candidate set and the base app's Frameworks folder.
          import zipfile
          with zipfile.ZipFile('YouTube.ipa') as archive:
              existing = {part for n in archive.namelist()
                          if '/Frameworks/' in n
                          for part in n.split('/') if part}
          names = set(deps) | {base.name} | existing
          for name, items in deps.items():
              if name in excluded:
                  continue
              for dep in items:
                  if dep.startswith(('@rpath/', '@loader_path/')):
                      required = dep.rsplit('/', 1)[-1]
                      if required not in names:
                          # Frameworks embed their executable under Foo.framework/Foo;
                          # compare the directory name, not just the executable.
                          framework = next((part for part in dep.split('/')
                                            if part.endswith('.framework')), None)
                          if framework not in existing:
                              excluded[name] = 'unbundled library: ' + dep
                              break

          # One further dependency pass handles any newly excluded libraries.
          changed = True
          while changed:
              changed = False
              for name, items in deps.items():
                  if name in excluded:
                      continue
                  for dep in items:
                      required = dep.rsplit('/', 1)[-1]
                      if required in excluded:
                          excluded[name] = 'depends on excluded ' + required
                          changed = True
                          break

          selected = [p for p in libs if p.name not in excluded]
          for name, reason in sorted(excluded.items()):
              print('SKIPPED ' + name + ': ' + reason)
          for p in selected:
              print('INCLUDED ' + p.name)
          Path('safe-dylibs.txt').write_text(''.join(str(p) + '\n' for p in selected))
          Path('excluded-dylibs.txt').write_text(''.join(
              name + ': ' + reason + '\n' for name, reason in sorted(excluded.items())))
          print(f'Safe extras: {len(selected)} / {len(libs)}')
          PYFILTER
          # Bash 3.2 + set -u cannot safely expand an empty array.
          dylibs=()
          while IFS= read -r lib; do
            if [[ -n "$lib" ]]; then
              dylibs+=("$lib")
            fi
          done < safe-dylibs.txt
          if [[ -s safe-dylibs.txt ]]; then
            bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output" "${dylibs[@]}"
          else
            echo "All optional tweaks excluded; packaging YTKACE only"
            bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output"
          fi
          bash Tools/verify-artifacts.sh "$ytkace" "$output"
          # Verify the final archive even when no optional tweak is eligible.
          python3 - "$output" "$ytkace" <<'PYVERIFY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              files = set(z.namelist())
              expected = [pathlib.Path(line.strip()).name for line in
                          pathlib.Path('safe-dylibs.txt').read_text().splitlines() if line.strip()]
              for name in expected:
                  assert any(p.endswith('/Frameworks/' + name) for p in files), f'Missing library: {name}'
          print('All requested dylibs are present')
          PYVERIFY
          echo "ipa=$output" >> "$GITHUB_OUTPUT"
      - name: Report excluded tweaks
        if: always()
        shell: bash
        run: |
          if [[ -f excluded-dylibs.txt ]]; then
            echo '### Excluded jailbreak-dependent tweaks' >> "$GITHUB_STEP_SUMMARY"
            cat excluded-dylibs.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

      - name: Trigger Release publication
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$GITHUB_RUN_ID"
