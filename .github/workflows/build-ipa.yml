name: IPA (RYD action-path audit v5, selectable tweaks)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Decrypted YouTube IPA URL
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: Return YouTube Dislike (sideload compatible filter; default ON)
        type: boolean
        default: true
      ryd_diagnostics:
        description: Show in-app RYD diagnostics screen and log status (default ON)
        type: boolean
        default: true
      add_ytuhd:
        description: YTUHD (default OFF)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig (default OFF)
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote (default OFF)
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent (untested; default OFF)
        type: boolean
        default: false
      add_youmute:
        description: YouMute + required YTVideoOverlay (default OFF)
        type: boolean
        default: false
      add_yougroupsettings:
        description: YouGroupSettings grouped tweak settings (default OFF)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  ytkace:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Build YTKACE Rootless DEB and extract shipped library
        shell: bash
        run: |
          set -euo pipefail
          # Theos installer can leave incompatible Clang precompiled modules.
          # Isolate this run's module cache and avoid parallel module rebuild races.
          rm -rf "${HOME}/.cache/clang/ModuleCache" "${THEOS}/obj"
          export CLANG_MODULE_CACHE_PATH="${RUNNER_TEMP}/ytkace-clang-modules-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          make clean
          make -j1 package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
          mkdir -p built-ytkace built-deb extracted
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Rootless DEB, found ${#packages[@]}" >&2
            exit 1
          fi
          version="$(awk '/^Version:/ {print $2}' control)"
          test -n "$version"
          deb="built-deb/com.itzzace.ytkace_${version}_rootless.deb"
          cp "${packages[0]}" "$deb"
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY_YTKACE'
          from pathlib import Path
          import shutil, struct, sys
          libs=[p for p in Path('extracted').rglob('YTKACE.dylib') if p.is_file()]
          if len(libs)!=1:
              sys.exit(f'Expected exactly one YTKACE.dylib in DEB, found: {libs}')
          p=libs[0]
          with p.open('rb') as f:
              magic=f.read(4)
              endian={b'\xfe\xed\xfa\xce':'>',b'\xce\xfa\xed\xfe':'<',b'\xfe\xed\xfa\xcf':'>',b'\xcf\xfa\xed\xfe':'<'}
              if magic not in endian:
                  sys.exit(f'YTKACE is not thin Mach-O: {p}; magic={magic.hex()}')
              f.seek(12)
              kind=struct.unpack(endian[magic]+'I',f.read(4))[0]
              if kind!=6:
                  sys.exit(f'YTKACE library has Mach-O type {kind}, expected MH_DYLIB (6): {p}')
          shutil.copy2(p,'built-ytkace/YTKACE.dylib')
          print('Using packaged real YTKACE library:',p)
          PY_YTKACE
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-library
          path: built-ytkace/YTKACE.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-rootless
          path: built-deb/*.deb
          if-no-files-found: error

  package:
    needs: ytkace
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-library
          path: built-ytkace
      - name: Download YTKACE Rootless DEB for single-pass cyan
        uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: built-deb
      - name: Install IPA signing tool
        run: brew install ldid
      - name: Install optional DEB and cyan tools
        if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_ytsilentvote || inputs.add_donteatmycontent || inputs.add_youmute || inputs.add_yougroupsettings }}
        run: |
          set -euo pipefail
          brew install dpkg
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          command -v dpkg-deb
          command -v cyan
          cyan --help >/dev/null
      - name: Install Theos for selected tweaks
        if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_ytsilentvote || inputs.add_donteatmycontent || inputs.add_youmute || inputs.add_yougroupsettings }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Build selected tweak DEBs together (no individual artifacts)
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
          RYD_DIAGNOSTICS: ${{ inputs.ryd_diagnostics }}
          ADD_YTUHD: ${{ inputs.add_ytuhd }}
          ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
          ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
          ADD_YOUMUTE: ${{ inputs.add_youmute }}
          ADD_YOUGROUPSETTINGS: ${{ inputs.add_yougroupsettings }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extra-debs sources
          : > selected-success.txt
          : > selected-failed.txt
          : > requested-tweaks.txt
          for pair in "ryd:$ADD_RYD" "ytuhd:$ADD_YTUHD" "ytabconfig:$ADD_YTABCONFIG" "ytsilentvote:$ADD_YTSILENTVOTE" "donteatmycontent:$ADD_DONTEATMYCONTENT" "youmute:$ADD_YOUMUTE" "yougroupsettings:$ADD_YOUGROUPSETTINGS"; do
            if [[ "${pair##*:}" == true ]]; then printf '%s\n' "${pair%%:*}" >> requested-tweaks.txt; fi
          done
          # Optional tweak build failures are reported, not fatal.
          mkdir -p "$THEOS/include"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader" || echo 'WARN: PSHeader unavailable (some tweaks may fail)'
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader" || echo 'WARN: YouTubeHeader unavailable (some tweaks may fail)'
          if [[ "$ADD_YTUHD" == true ]]; then
            brew install meson ninja pkg-config autoconf automake libtool nasm yasm || echo 'WARN: YTUHD build tools setup failed'
          fi

          build_one() {
            local key="$1" repo="$2" flag="$3" out="sources/$1"
            [[ "$flag" == true ]] || return 0
            echo "::group::Building optional tweak $key"
            if ! git clone --depth 1 --recurse-submodules "https://github.com/$repo.git" "$out"; then
              echo "FAILED $key: git clone" | tee -a selected-failed.txt
              echo '::endgroup::'
              return 0
            fi
            # RYD upstream filters only the stock bundle ID. Sideload signing
            # may change CFBundleIdentifier, preventing Substrate from loading
            # an otherwise correctly injected dylib. Match the executable
            # instead, which remains "YouTube" for this IPA build.
            if [[ "$key" == ryd ]]; then
              python3 - "$out" <<'PY_RYD_FILTER'
          from pathlib import Path
          import plistlib, sys
          root = Path(sys.argv[1])
          p = root / 'YouTubeDislikesReturn.plist'
          if not p.is_file():
              sys.exit('RYD filter plist missing: ' + str(p))
          # The upstream file uses OpenStep syntax; write a standard XML plist
          # understood by Substrate/Cyan. Only change the loader filter.
          original = p.read_text()
          if 'com.google.ios.youtube' not in original or 'Filter' not in original:
              sys.exit('Unexpected RYD filter contents; refusing blind patch')
          p.write_bytes(plistlib.dumps({'Filter': {'Executables': ['YouTube']}}, fmt=plistlib.FMT_XML))
          print('RYD sideload filter: Executables = YouTube (bundle-ID independent)')
          PY_RYD_FILTER
            fi
            if [[ "$key" == ryd && "$RYD_DIAGNOSTICS" == true ]]; then
              python3 - "$out" <<'PY_RYD_DIAGNOSTIC'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          api = root / 'API.x'
          tweak = root / 'Tweak.x'
          if not api.is_file() or not tweak.is_file():
              sys.exit('RYD diagnostics: required upstream sources not found')
          a = api.read_text()
          t = tweak.read_text()
          def replace_once(source, old, new, label):
              if source.count(old) != 1:
                  sys.exit(f'RYD diagnostics: upstream changed ({label}); cannot safely instrument')
              return source.replace(old, new, 1)
          # No video ID, URL, vote data, or account identifiers are printed.
          a = replace_once(a,
              'NSUInteger responseCode = [httpResponse statusCode];',
              'NSUInteger responseCode = [httpResponse statusCode];\n    NSLog(@"[RYD-DIAG] API HTTP status=%lu networkError=%d", (unsigned long)responseCode, error != nil);',
              'API status')
          a = replace_once(a,
              'dispatch_async(dispatch_get_main_queue(), ^{\n            dataHandler(myData);',
              'NSLog(@"[RYD-DIAG] API JSON parsed successfully");\n        dispatch_async(dispatch_get_main_queue(), ^{\n            dataHandler(myData);',
              'API JSON callback')
          t = replace_once(t,
              '    YTQTMButton *dislikeButton = self.dislikeButton;',
              '    NSLog(@"[RYD-DIAG] Shorts like/dislike hook invoked");\n    YTQTMButton *dislikeButton = self.dislikeButton;',
              'Shorts hook')
          t = replace_once(t,
              '    getVoteFromVideoWithHandler(cache, videoId, maxRetryCount, ^(NSDictionary *data, NSString *error) {',
              '    NSLog(@"[RYD-DIAG] Requesting vote data from UI hook");\n    getVoteFromVideoWithHandler(cache, videoId, maxRetryCount, ^(NSDictionary *data, NSString *error) {',
              'general video request hook')
          t = replace_once(t,
              '        HBLogDebug(@"RYD: Vote data for video %@: %@", videoId, data);',
              '        NSLog(@"[RYD-DIAG] UI vote callback hasData=%d hasError=%d", data != nil, error != nil);',
              'general video callback')
          api.write_text(a)
          tweak.write_text(t)
          # Keep private values (video IDs, user IDs, URLs, responses) out of diagnostics.
          # NSUserDefaults is read by the diagnostic entry in the RYD settings screen.
          def append_marker(text, old, replacement, label):
              if text.count(old) != 1:
                  sys.exit(f'RYD on-device diagnostics: upstream mismatch ({label})')
              return text.replace(old, replacement, 1)
          a = append_marker(a,
              'NSLog(@"[RYD-DIAG] API HTTP status=%lu networkError=%d", (unsigned long)responseCode, error != nil);',
              'NSLog(@"[RYD-DIAG] API HTTP status=%lu networkError=%d", (unsigned long)responseCode, error != nil);'
              '\n    [[NSUserDefaults standardUserDefaults] setObject:[NSString stringWithFormat:@"HTTP %lu, networkError=%d", (unsigned long)responseCode, error != nil] forKey:@"RYDDiagHTTP"];',
              'api http marker')
          a = append_marker(a,
              'NSLog(@"[RYD-DIAG] API JSON parsed successfully");',
              'NSLog(@"[RYD-DIAG] API JSON parsed successfully");'
              '\n        [[NSUserDefaults standardUserDefaults] setObject:@"JSON parsed OK" forKey:@"RYDDiagJSON"];',
              'api data marker')
          t = append_marker(t,
              'NSLog(@"[RYD-DIAG] Shorts like/dislike hook invoked");',
              'NSLog(@"[RYD-DIAG] Shorts like/dislike hook invoked");'
              '\n    [[NSUserDefaults standardUserDefaults] setObject:@"Shorts hook called" forKey:@"RYDDiagShorts"];',
              'shorts marker')
          t = append_marker(t,
              'NSLog(@"[RYD-DIAG] Requesting vote data from UI hook");',
              'NSLog(@"[RYD-DIAG] Requesting vote data from UI hook");'
              '\n    [[NSUserDefaults standardUserDefaults] setObject:@"Video UI requested votes" forKey:@"RYDDiagVideo"];',
              'video marker')
          t = append_marker(t,
              'NSLog(@"[RYD-DIAG] UI vote callback hasData=%d hasError=%d", data != nil, error != nil);',
              'NSLog(@"[RYD-DIAG] UI vote callback hasData=%d hasError=%d", data != nil, error != nil);'
              '\n        [[NSUserDefaults standardUserDefaults] setObject:[NSString stringWithFormat:@"hasData=%d, hasError=%d", data != nil, error != nil] forKey:@"RYDDiagCallback"];',
              'callback marker')
          # v5: observe upstream hook ENTRY before layout / video-ID filtering.
          # This distinguishes missing hook invocation from a changed UI layout.
          # No actual IDs, counts, media metadata, or account values are recorded.
          early_anchor = '- (ELMCellNode *)nodeForItemAtIndexPath:(NSIndexPath *)indexPath {'
          t = replace_once(t, early_anchor, early_anchor + r'''
              static BOOL rydDidRecordCollection = NO;
              static BOOL rydDidRecordActionCollection = NO;
              if (!rydDidRecordCollection) {
                  rydDidRecordCollection = YES;
                  [[NSUserDefaults standardUserDefaults] setObject:@"호출됨" forKey:@"RYDPathCollectionEntry"];
              }
              NSString *rydCollectionId = self.accessibilityIdentifier;
              if (!rydDidRecordActionCollection &&
                  [rydCollectionId containsString:@"video"] &&
                  [rydCollectionId containsString:@"action_bar"]) {
                  rydDidRecordActionCollection = YES;
                  // Log a fixed label, not arbitrary identifiers from view data.
                  NSString *kind = [rydCollectionId isEqualToString:@"id.video.scrollable_action_bar"]
                      ? @"기존 scrollable_action_bar"
                      : ([rydCollectionId isEqualToString:@"id.video.non_scrollable_action_bar"]
                          ? @"non_scrollable_action_bar" : @"다른 video action_bar");
                  [[NSUserDefaults standardUserDefaults] setObject:kind forKey:@"RYDPathActionKind"];
              }
          ''' , 'ASCollectionView entry')
          # The upstream matching function uses one literal ID; record whether
          # this branch is reached before any potentially fragile tree traversal.
          t = replace_once(t,
              'else if (isVideoScrollableActionBar(self, node)) {',
              'else if (isVideoScrollableActionBar(self, node)) {\n        [[NSUserDefaults standardUserDefaults] setObject:@"진입함" forKey:@"RYDPathActionBranch"];',
              'regular action bar branch')
          # Use a hook that v4 proved exists; do not guess signatures for
          # YTReelWatchLikesController's newly named methods.
          shorts_anchor = '%hook YTReelWatchPlaybackOverlayView\n'
          if t.count(shorts_anchor) != 1:
              sys.exit('v5: overlay class hook changed')
          begin, after = t.split(shorts_anchor, 1)
          method_anchor = '- (void)layoutActionBar {'
          if after.count(method_anchor) < 1:
              sys.exit('v5: overlay layoutActionBar missing')
          after = after.replace(method_anchor, method_anchor + r'''
              static BOOL rydDidRecordShortOverlay = NO;
              if (!rydDidRecordShortOverlay) {
                  rydDidRecordShortOverlay = YES;
                  [[NSUserDefaults standardUserDefaults] setObject:@"호출됨" forKey:@"RYDPathShortOverlay"];
              }
          ''', 1)
          t = begin + shorts_anchor + after
          settings = root / 'Settings.x'
          if not settings.is_file():
              sys.exit('RYD on-device diagnostics: Settings.x missing')
          contents = settings.read_text()
          anchor = '    [sectionItems addObject:rawData];'
          if contents.count(anchor) != 1:
              sys.exit('RYD on-device diagnostics: settings anchor not found')
          diagnostic_item = r'''
          // This is intentionally a tappable switch-shaped action: it remains OFF.
          // No additional navigation hooks are needed and the existing RYD settings remain intact.
          YTSettingsSectionItem *diagItem = [%c(YTSettingsSectionItem) switchItemWithTitle:@"RYD 진단 보기 (탭)"
              titleDescription:@"API 및 화면 호출 기록 보기 / Mac 불필요"
              accessibilityIdentifier:nil
              switchOn:NO
              switchBlock:^BOOL (YTSettingsCell *cell, BOOL newValue) {
                  NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
                  NSArray<NSString *> *keys = @[@"RYDDiagLoaded", @"RYDDiagManual", @"RYDDiagHTTP", @"RYDDiagJSON", @"RYDDiagVideo", @"RYDDiagCallback", @"RYDDiagShorts"];
                  NSArray<NSString *> *titles = @[@"RYD 모듈 로드", @"아이폰 직접 API 검사", @"RYD API HTTP", @"RYD API JSON", @"일반 동영상 훅", @"동영상 콜백", @"Shorts 훅"];
                  NSMutableArray<NSString *> *lines = [NSMutableArray array];
                  for (NSUInteger i = 0; i < keys.count; i++) {
                      NSString *value = [d stringForKey:keys[i]];
                      [lines addObject:[NSString stringWithFormat:@"%@: %@", titles[i], value ?: @"기록 없음"]];
                  }
                  NSString *details = [lines componentsJoinedByString:@"\n"];
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"RYD Diagnostics"
                      message:details preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"복사" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      [UIPasteboard generalPasteboard].string = details;
                  }]];
                  [alert addAction:[UIAlertAction actionWithTitle:@"기록 초기화" style:UIAlertActionStyleDestructive handler:^(UIAlertAction *action) {
                      for (NSString *key in keys) {
                      if (![key isEqualToString:@"RYDDiagLoaded"]) [d removeObjectForKey:key];
                  }
                  }]];
                  [alert addAction:[UIAlertAction actionWithTitle:@"닫기" style:UIAlertActionStyleCancel handler:nil]];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [delegate presentViewController:alert animated:YES completion:nil];
                  });
                  return NO;
              }
              settingItemId:0];
          [sectionItems addObject:diagItem];
          // Explicit on-device network probe. Uses a public demo video ID; never the user's video ID.
          // This tests iPhone connectivity, independently of YouTube's UI hooks.
          YTSettingsSectionItem *apiTestItem = [%c(YTSettingsSectionItem) switchItemWithTitle:@"RYD API 직접 검사 (탭)"
              titleDescription:@"아이폰에서 직접 서버 연결 테스트 (공개 테스트 영상 사용)"
              accessibilityIdentifier:nil
              switchOn:NO
              switchBlock:^BOOL (YTSettingsCell *cell, BOOL newValue) {
                  NSUserDefaults *prefs = [NSUserDefaults standardUserDefaults];
                  [prefs setObject:@"검사 진행 중" forKey:@"RYDDiagManual"];
                  NSURL *testURL = [NSURL URLWithString:@"https://returnyoutubedislikeapi.com/votes?videoId=dQw4w9WgXcQ"];
                  NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithURL:testURL
                      completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                          NSInteger status = [(NSHTTPURLResponse *)response statusCode];
                          BOOL hasDislikes = NO;
                          if (data.length) {
                              NSDictionary *parsed = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                              hasDislikes = [parsed isKindOfClass:[NSDictionary class]] && parsed[@"dislikes"] != nil;
                          }
                          NSString *value = [NSString stringWithFormat:@"HTTP %ld / dislikes 필드 %@ / 네트워크 오류 %@",
                              (long)status, hasDislikes ? @"있음" : @"없음", error ? @"있음" : @"없음"];
                          [prefs setObject:value forKey:@"RYDDiagManual"];
                          dispatch_async(dispatch_get_main_queue(), ^{
                              UIAlertController *result = [UIAlertController alertControllerWithTitle:@"RYD API 검사 결과"
                                  message:value preferredStyle:UIAlertControllerStyleAlert];
                              [result addAction:[UIAlertAction actionWithTitle:@"확인" style:UIAlertActionStyleDefault handler:nil]];
                              [delegate presentViewController:result animated:YES completion:nil];
                          });
                      }];
                  [task resume];
                  return NO;
              }
              settingItemId:0];
          [sectionItems addObject:apiTestItem];'''
          # On-device Objective-C runtime audit: check upstream RYD hook targets
          # without calling private methods or accessing any account/video data.
          compatibility_item = r'''
          YTSettingsSectionItem *hookAuditItem = [%c(YTSettingsSectionItem) switchItemWithTitle:@"RYD 훅 호환성 검사 (탭)"
              titleDescription:@"현재 YouTube에서 RYD 클래스와 메서드 존재 여부 확인"
              accessibilityIdentifier:nil
              switchOn:NO
              switchBlock:^BOOL (YTSettingsCell *cell, BOOL newValue) {
                  NSArray<NSArray<NSString *> *> *targets = @[
                      @[@"YTReelWatchLikesController", @"updateLikeButtonWithRenderer:"],
                      @[@"ASCollectionView", @"nodeForItemAtIndexPath:"],
                      @[@"YTReelWatchPlaybackOverlayView", @"layoutActionBar"],
                      @[@"YTReelWatchPlaybackOverlayViewSub", @"layoutActionBar"],
                      @[@"YTAsyncCollectionView", @"pageStyleDidChange:"],
                      @[@"YTRollingNumberNode", @"updateRollingNumberView"],
                      @[@"ELMNodeFactory", @"classForElement:materializationContext:"]
                  ];
                  NSMutableArray<NSString *> *results = [NSMutableArray array];
                  NSUInteger present = 0;
                  for (NSArray<NSString *> *pair in targets) {
                      NSString *className = pair[0], *selectorName = pair[1];
                      Class klass = NSClassFromString(className);
                      BOOL exists = klass != Nil;
                      BOOL methodExists = exists && class_getInstanceMethod(klass, NSSelectorFromString(selectorName)) != NULL;
                      if (methodExists) present++;
                      [results addObject:[NSString stringWithFormat:@"%@: %@", className,
                          !exists ? @"클래스 없음" : (methodExists ? @"메서드 있음" : @"메서드 없음")]];
                  }
                  NSString *details = [NSString stringWithFormat:@"검사 항목 %lu / %lu\n\n%@\n\n존재 여부는 훅 호출이나 기능 성공을 보장하지 않습니다.",
                      (unsigned long)present, (unsigned long)targets.count,
                      [results componentsJoinedByString:@"\n"]];
                  [[NSUserDefaults standardUserDefaults] setObject:details forKey:@"RYDDiagHookAudit"];
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"RYD 훅 호환성 검사"
                      message:details preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"복사" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      [UIPasteboard generalPasteboard].string = details;
                  }]];
                  [alert addAction:[UIAlertAction actionWithTitle:@"닫기" style:UIAlertActionStyleCancel handler:nil]];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [delegate presentViewController:alert animated:YES completion:nil];
                  });
                  return NO;
              }
              settingItemId:0];
          [sectionItems addObject:hookAuditItem];
          YTSettingsSectionItem *selectorAuditItem = [%c(YTSettingsSectionItem) switchItemWithTitle:@"RYD 메서드 후보 조사 v4 (탭)"
              titleDescription:@"현재 실행 중인 YouTube에서 관련 메서드 이름을 찾습니다 (개인정보 수집 없음)"
              accessibilityIdentifier:nil
              switchOn:NO
              switchBlock:^BOOL (YTSettingsCell *cell, BOOL newValue) {
                  // Inspect Objective-C metadata only. Do not invoke methods, alter app state,
                  // read video IDs, touch user data or enumerate objects.
                  NSArray<NSString *> *classNames = @[
                      @"YTReelWatchLikesController", @"YTReelWatchPlaybackOverlayView",
                      @"YTReelWatchPlaybackOverlayViewSub", @"ASCollectionView",
                      @"YTAsyncCollectionView", @"YTRollingNumberNode", @"ELMNodeFactory"
                  ];
                  NSMutableArray<NSString *> *lines = [NSMutableArray array];
                  for (NSString *name in classNames) {
                      Class cls = NSClassFromString(name);
                      if (!cls) {
                          [lines addObject:[NSString stringWithFormat:@"%@: CLASS MISSING", name]];
                          continue;
                      }
                      NSMutableSet<NSString *> *found = [NSMutableSet set];
                      Class cursor = cls;
                      NSUInteger inheritedLevels = 0;
                      while (cursor && inheritedLevels < 3) {
                          unsigned int count = 0;
                          Method *methods = class_copyMethodList(cursor, &count);
                          for (unsigned int i = 0; i < count; i++) {
                              NSString *sel = NSStringFromSelector(method_getName(methods[i]));
                              NSString *low = [sel lowercaseString];
                              if ([low containsString:@"like"] || [low containsString:@"dislike"] ||
                                  [low containsString:@"vote"] || [low containsString:@"actionbar"] ||
                                  [low containsString:@"overlay"] || [low containsString:@"rolling"] ||
                                  [low containsString:@"nodeforitem"] || [low containsString:@"pagestyle"]) {
                                  [found addObject:sel];
                              }
                          }
                          if (methods) free(methods);
                          cursor = class_getSuperclass(cursor);
                          inheritedLevels++;
                      }
                      NSArray<NSString *> *sorted = [[found allObjects] sortedArrayUsingSelector:@selector(compare:)];
                      NSUInteger max = MIN(sorted.count, (NSUInteger)25);
                      NSArray<NSString *> *limited = [sorted subarrayWithRange:NSMakeRange(0, max)];
                      [lines addObject:[NSString stringWithFormat:@"%@ (%lu candidates): %@%@", name,
                          (unsigned long)sorted.count,
                          limited.count ? [limited componentsJoinedByString:@", "] : @"NONE",
                          sorted.count > max ? @" [truncated]" : @""]];
                  }
                  NSString *report = [NSString stringWithFormat:@"RYD v4 selector audit | %@\n\n%@\n\nMetadata only; selector presence does not prove that hooks fire.",
                      [[NSBundle mainBundle] objectForInfoDictionaryKey:@"CFBundleShortVersionString"] ?: @"version unknown",
                      [lines componentsJoinedByString:@"\n\n"]];
                  // Pasteboard allows sharing without a Mac or telemetry.
                  [UIPasteboard generalPasteboard].string = report;
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"RYD 메서드 조사 v4"
                      message:@"검사 결과를 클립보드에 복사했습니다. 이 대화에 붙여넣어 보내 주세요."
                      preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"다시 복사" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      [UIPasteboard generalPasteboard].string = report;
                  }]];
                  [alert addAction:[UIAlertAction actionWithTitle:@"닫기" style:UIAlertActionStyleCancel handler:nil]];
                  dispatch_async(dispatch_get_main_queue(), ^{ [delegate presentViewController:alert animated:YES completion:nil]; });
                  return NO;
              }
              settingItemId:0];
          [sectionItems addObject:selectorAuditItem];
          '''
          # v5 compact on-device route inspector. It records only named
          # Objective-C execution paths; it does not log video or account data.
          action_path_item = r'''
          YTSettingsSectionItem *routeItem = [%c(YTSettingsSectionItem) switchItemWithTitle:@"RYD 화면 경로 검사 v5 (탭)"
              titleDescription:@"일반 동영상/Shorts 화면 진입 경로 확인 (Mac 불필요)"
              accessibilityIdentifier:nil
              switchOn:NO
              switchBlock:^BOOL (YTSettingsCell *cell, BOOL newValue) {
                  NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                  NSArray<NSString *> *keys = @[@"RYDPathCollectionEntry", @"RYDPathActionKind",
                      @"RYDPathActionBranch", @"RYDPathShortOverlay"];
                  NSArray<NSString *> *titles = @[@"일반 화면 컬렉션 훅", @"동영상 버튼 영역 유형",
                      @"기존 버튼 경로 진입", @"Shorts 오버레이 훅"];
                  NSMutableArray<NSString *> *items = [NSMutableArray array];
                  for (NSUInteger index = 0; index < keys.count; index++) {
                      NSString *saved = [defaults stringForKey:keys[index]];
                      [items addObject:[NSString stringWithFormat:@"%@: %@", titles[index], saved ?: @"기록 없음"]];
                  }
                  NSString *details = [items componentsJoinedByString:@"\n"];
                  UIAlertController *panel = [UIAlertController alertControllerWithTitle:@"RYD 화면 경로 v5"
                      message:details preferredStyle:UIAlertControllerStyleAlert];
                  [panel addAction:[UIAlertAction actionWithTitle:@"복사" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      [UIPasteboard generalPasteboard].string = details;
                  }]];
                  [panel addAction:[UIAlertAction actionWithTitle:@"초기화" style:UIAlertActionStyleDestructive handler:^(UIAlertAction *action) {
                      for (NSString *key in keys) [defaults removeObjectForKey:key];
                  }]];
                  [panel addAction:[UIAlertAction actionWithTitle:@"닫기" style:UIAlertActionStyleCancel handler:nil]];
                  dispatch_async(dispatch_get_main_queue(), ^{ [delegate presentViewController:panel animated:YES completion:nil]; });
                  return NO;
              }
              settingItemId:0];
          [sectionItems addObject:routeItem];
          '''
          contents = contents.replace(anchor, anchor + '\n' + diagnostic_item + '\n' + compatibility_item + '\n' + action_path_item, 1)

          contents = '#import <objc/runtime.h>\n#import <UIKit/UIKit.h>\n' + contents
          # Constructor runs when RYD's dylib is loaded, before screen-specific hooks.
          # Keep this diagnostic in the same binary as the RYD settings extension.
          contents += r'''
          __attribute__((constructor)) static void RYDOnDeviceDiagnosticLoaded(void) {
              [[NSUserDefaults standardUserDefaults] setObject:@"로드됨" forKey:@"RYDDiagLoaded"];
          }
          '''
          settings.write_text(contents)
          api.write_text(a)
          tweak.write_text(t)
          print('RYD in-app diagnostics v5 with action route audit enabled: Settings > Return YouTube Dislike > RYD 진단 보기 / RYD API 직접 검사')
          print('RYD privacy-safe diagnostics enabled: API status, callback, shorts hook, video hook')
          PY_RYD_DIAGNOSTIC
            fi
            if [[ "$key" == donteatmycontent ]]; then
              python3 - "$out" <<'PY_PATCH'
          from pathlib import Path
          import sys
          d=Path(sys.argv[1]); h=d/'Tweak.h'; t=d/'Tweak.x'
          if h.exists() and t.exists():
              hs=h.read_text(); ts=t.read_text()
              if hs.count('CGFloat constant;')==1 and '#import "Tweak.h"' in ts:
                  h.write_text(hs.replace('CGFloat constant;','extern CGFloat constant;',1))
                  t.write_text(ts.replace('#import "Tweak.h"','#import "Tweak.h"\nCGFloat constant;',1))
          PY_PATCH
            fi
            # On the default macOS runner filesystem, a sibling symlink whose
            # name differs only by case can resolve to the lowercase checkout.
            # Clang treats this as -Wnonportable-include-path (an error).
            # Rewrite the two upstream relative includes to the actual
            # checkout path instead; do not modify the helper source itself.
            if [[ "$key" == youmute ]]; then
              python3 - "$out" <<'PY_YOUMUTE_CASE'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]) / 'Tweak.x'
          helper = Path(sys.argv[1]).parent / 'ytvideooverlay'
          if not source.is_file() or not (helper / 'Header.h').is_file() or not (helper / 'Init.x').is_file():
              sys.exit('YouMute/YTVideoOverlay required source files are missing')
          contents = source.read_text()
          for filename in ('Header.h', 'Init.x'):
              before = '../YTVideoOverlay/' + filename
              after = '../ytvideooverlay/' + filename
              if contents.count(before) != 1:
                  sys.exit(f'Unexpected YouMute include: {before}')
              contents = contents.replace(before, after, 1)
          source.write_text(contents)
          print('YouMute includes matched to lowercase ytvideooverlay checkout')
          PY_YOUMUTE_CASE
            fi
            # Run compilation in a contained command, so a single optional
            # failure cannot abort the entire IPA build.
            if ! ( cd "$out"
                   make clean >/dev/null 2>&1 || true
                   if [[ "$key" == ytuhd ]]; then
                     make libvpx && make dav1d && make package SIDELOAD=1 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
                   else
                     make package SIDELOAD=1 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
                   fi ); then
              echo "FAILED $key: make" | tee -a selected-failed.txt
              echo '::endgroup::'
              return 0
            fi
            # Keep the complete DEB and its supporting files. Do NOT reject
            # tweaks merely because they reference CydiaSubstrate: whether
            # they run depends on the runtime installed/injected at launch.
            if python3 - "$key" "$out" "extra-debs" <<'PY_DEB'
          from pathlib import Path
          import shutil, subprocess, sys, tempfile
          key, path, dest = sys.argv[1:]
          packages = sorted((Path(path)/'packages').glob('*.deb'))
          if len(packages) != 1:
              sys.exit(f'{key}: expected 1 DEB, found {len(packages)}')
          package = packages[0]
          subprocess.run(['dpkg-deb', '--info', str(package)], stdout=subprocess.DEVNULL, check=True)
          with tempfile.TemporaryDirectory() as temp:
              subprocess.run(['dpkg-deb', '-x', str(package), temp], check=True)
              files = [f for f in Path(temp).rglob('*.dylib')
                       if f.is_file() and not any(part.lower().endswith('.dsym') for part in f.parts)]
              if not files:
                  sys.exit(f'{key}: DEB contains no loadable dylib candidate')
              for lib in files:
                  data = lib.read_bytes()
                  if b'CydiaSubstrate.framework/CydiaSubstrate' in data:
                      print(f'RUNTIME WARNING [{key}]: {lib.name} references CydiaSubstrate; ensure the IPA/runtime can resolve it')
          target = Path(dest)/(key + '.deb')
          if target.exists():
              sys.exit(f'{key}: duplicate output')
          shutil.copy2(package, target)
          print('READY DEB:', key, target)
          PY_DEB
            then
              echo "OK $key" | tee -a selected-success.txt
            else
              echo "FAILED $key: invalid/unsupported DEB or missing sideload runtime" | tee -a selected-failed.txt
            fi
            echo '::endgroup::'
          }

          if [[ "$ADD_RYD" == true ]]; then
            build_one ryd PoomSmart/Return-YouTube-Dislikes true
          fi
          build_one ytuhd PoomSmart/YTUHD "$ADD_YTUHD"
          build_one ytabconfig PoomSmart/YTABConfig "$ADD_YTABCONFIG"
          build_one ytsilentvote PoomSmart/YTSilentVote "$ADD_YTSILENTVOTE"
          build_one donteatmycontent therealFoxster/DontEatMyContent "$ADD_DONTEATMYCONTENT"
          # YouMute includes ../YTVideoOverlay/Header.h and ../YTVideoOverlay/Init.x.
          # Build the helper first from a sibling checkout, and ship both DEBs.
          # A failed helper build must NOT leave a standalone unusable YouMute.
          if [[ "$ADD_YOUMUTE" == true ]]; then
            build_one ytvideooverlay PoomSmart/YTVideoOverlay true
            if [[ -s extra-debs/ytvideooverlay.deb ]] && [[ -f sources/ytvideooverlay/Header.h ]] && [[ -f sources/ytvideooverlay/Init.x ]]; then
              # Match imports to the actual lowercase checkout in build_one.
              # Avoid case-only symlinks on macOS case-insensitive filesystems.
              build_one youmute PoomSmart/YouMute true
            else
              echo 'FAILED youmute: required YTVideoOverlay helper could not be built' | tee -a selected-failed.txt
            fi
            # Treat these two packages as a pair; never inject just one.
            if [[ ! -s extra-debs/ytvideooverlay.deb || ! -s extra-debs/youmute.deb ]]; then
              rm -f extra-debs/ytvideooverlay.deb extra-debs/youmute.deb
              echo 'FAILED youmute-pair: helper or main tweak missing; excluded both DEBs' | tee -a selected-failed.txt
            fi
          fi
          build_one yougroupsettings PoomSmart/YouGroupSettings "$ADD_YOUGROUPSETTINGS"
          echo 'Successfully built optional DEB packages:'
          find extra-debs -maxdepth 1 -type f -name '*.deb' -print | sort
          echo 'Skipped optional tweaks:'
          cat selected-failed.txt

      - name: RYD public API preflight (CI network only)
        if: ${{ inputs.add_ryd && inputs.ryd_diagnostics }}
        shell: bash
        run: |
          set -uo pipefail
          echo '## RYD API preflight (GitHub runner, NOT iPhone)' >> "$GITHUB_STEP_SUMMARY"
          result="$(curl -sS -L --connect-timeout 10 --max-time 20 -o "$RUNNER_TEMP/ryd-api.json" -w '%{http_code}' 'https://returnyoutubedislikeapi.com/votes?videoId=dQw4w9WgXcQ')" || result='NETWORK_ERROR'
          echo "HTTP status: $result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" == 200 ]]; then
            python3 - "$RUNNER_TEMP/ryd-api.json" "$GITHUB_STEP_SUMMARY" <<'PY_RYD_API'
          import json,sys
          try:
              obj=json.load(open(sys.argv[1]))
              ok=isinstance(obj,dict) and 'dislikes' in obj
              message='JSON contains dislikes field: '+str(ok)
          except (ValueError, OSError) as ex:
              message='JSON parse error: '+type(ex).__name__
          with open(sys.argv[2],'a') as f: f.write(message+'\n')
          PY_RYD_API
          fi
          echo 'This preflight does not demonstrate on-device connectivity or UI compatibility.' >> "$GITHUB_STEP_SUMMARY"

      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PY_IPA'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'Invalid IPA'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(x.startswith('Payload/') and x.endswith('.app/Info.plist') for x in z.namelist())
          PY_IPA

      - name: Package YTKACE and selected tweak DEBs in one pass
        id: inject
        shell: bash
        run: |
          set -euo pipefail
          ytkace=built-ytkace/YTKACE.dylib
          test -s "$ytkace"
          export LDID="$(brew --prefix)/bin/ldid"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY_VER'
          import plistlib,zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info=next(x for x in z.namelist() if x.startswith('Payload/') and x.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PY_VER
          )"
          output="YouTube_${youtube_version}_YTKACE_${version}.ipa"
          final_output="$output"

          # Preserve the known-good YTKACE-only path as a fallback.
          bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output"
          bash Tools/verify-artifacts.sh "$ytkace" "$output"
          cp "$output" baseline-ytkace.ipa

          shopt -s nullglob
          optional_debs=(extra-debs/*.deb)
          built_debs=(built-deb/*.deb)
          # Construct cyan inputs from the YTKACE DEB and successful optional DEBs.
          if (( ${#built_debs[@]} != 1 )); then
            echo "ERROR: expected exactly one YTKACE DEB; got ${#built_debs[@]}" >&2
            exit 1
          fi
          if (( ${#optional_debs[@]} )); then
            # IMPORTANT: start from the ORIGINAL decrypted YouTube IPA.
            # Do not run cyan on the already patched/signed YTKACE IPA.
            # Feed the YTKACE DEB and selected optional DEBs in ONE pass.
            candidate="${output%.ipa}.cyan.ipa"
            cyan_inputs=("${built_debs[0]}" "${optional_debs[@]}")
            if command -v cyan >/dev/null 2>&1 \
               && cyan -i YouTube.ipa -o "$candidate" -uwef "${cyan_inputs[@]}" \
               && python3 - "$candidate" "${built_debs[0]}" "${optional_debs[@]}" <<'PY_CYAN'
          from pathlib import Path, PurePosixPath
          import os, plistlib, struct, subprocess, sys, tempfile, zipfile
          ipa, *debs = sys.argv[1:]
          # Confirm that EVERY .dylib carried by each requested DEB appears in the IPA.
          expected = {'YTKACE.dylib'}
          with tempfile.TemporaryDirectory() as temp:
              for idx, deb in enumerate(debs):
                  dst = Path(temp) / f'deb-{idx}'
                  dst.mkdir()
                  subprocess.run(['dpkg-deb', '-x', deb, str(dst)], check=True)
                  expected.update(p.name for p in dst.rglob('*.dylib')
                                  if not any(part.lower().endswith('.dsym') for part in p.parts))
              with zipfile.ZipFile(ipa) as z:
                  assert z.testzip() is None, 'Damaged ZIP member'
                  files = z.namelist()
                  plists = [n for n in files if n.startswith('Payload/') and n.count('.app/') == 1 and n.endswith('.app/Info.plist')]
                  assert len(plists) == 1, f'Expected one app Info.plist, found {plists}'
                  plistlib.loads(z.read(plists[0]))
                  by_name = {PurePosixPath(n).name: n for n in files if n.endswith('.dylib') and '.dSYM/' not in n}
                  missing = expected - set(by_name)
                  assert not missing, f'Cyan lost requested tweak libraries: {sorted(missing)}'
                  for name in sorted(expected):
                      payload = z.read(by_name[name])
                      assert len(payload) > 32, f'Empty dylib: {name}'
                      # Reject Mach-O dSYM objects mistakenly named .dylib.
                      endian = {b'\xfe\xed\xfa\xcf': '>', b'\xcf\xfa\xed\xfe': '<',
                                b'\xfe\xed\xfa\xce': '>', b'\xce\xfa\xed\xfe': '<'}
                      if payload[:4] in endian:
                          kind = struct.unpack(endian[payload[:4]] + 'I', payload[12:16])[0]
                          assert kind == 6, f'{name} is Mach-O type {kind}, not MH_DYLIB'
                      elif payload[:4] not in (b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca',
                                                b'\xca\xfe\xba\xbf', b'\xbf\xba\xfe\xca'):
                          raise AssertionError(f'{name} is not Mach-O')
                  # Check actual load commands, not arbitrary string occurrences.
                  z.extractall(temp)
                  unresolved = []
                  for name in sorted(expected):
                      file = Path(temp) / by_name[name]
                      result = subprocess.run(['otool', '-L', str(file)], capture_output=True, text=True)
                      assert result.returncode == 0, f'otool failed for {name}: {result.stderr.strip()}'
                      if '@rpath/CydiaSubstrate.framework/CydiaSubstrate' in result.stdout:
                          if not any('CydiaSubstrate.framework/CydiaSubstrate' in f for f in files):
                              unresolved.append(name)
                  assert not unresolved, f'Unresolved CydiaSubstrate library: {unresolved}'
                  # Validate all @rpath library references of packaged tweaks.
                  # This detects runtime dependencies not caught by a simple file-presence check.
                  binaries = [p for p in (Path(temp)/'Payload').rglob('*') if p.is_file() and (
                      p.suffix == '.dylib' or p.parent.suffix == '.framework' and p.name == p.parent.stem)]
                  present = set(files)
                  missing_runtime = []
                  for binary in binaries:
                      result = subprocess.run(['otool', '-L', str(binary)], capture_output=True, text=True)
                      if result.returncode:
                          continue
                      for line in result.stdout.splitlines()[1:]:
                          dep = line.strip().split(' (', 1)[0]
                          if not dep.startswith('@rpath/'):
                              continue
                          suffix = dep[len('@rpath/'):]
                          # Apple supplies standard Swift runtime libraries through
                          # the OS/dyld shared cache. They are not required to be
                          # bundled in the IPA; treating them as missing caused a
                          # false FALLBACK after cyan successfully built the IPA.
                          if '/' not in suffix and suffix.startswith('libswift') and suffix.endswith('.dylib'):
                              continue
                          # Non-system @rpath dependencies MUST be bundled,
                          # including non-system runtime dependencies.
                          if not any(path.endswith('/Frameworks/' + suffix) or
                                     path.endswith('/' + suffix) for path in present):
                              missing_runtime.append((binary.name, dep))
                  assert not missing_runtime, 'Unresolved packaged @rpath dependencies: ' + repr(missing_runtime)
          if any(Path(d).name == 'ryd.deb' for d in debs):
              assert 'YouTubeDislikesReturn.dylib' in by_name, 'RYD dylib missing'
              print('RYD dylib present in IPA; on-device initialization and UI hooks still need testing')
          print('Verified integrated Mach-O libraries:', ', '.join(sorted(expected)))
          PY_CYAN
            then
              mv -f "$candidate" "$output"
              echo 'INTEGRATED: YTKACE and optional DEBs from original IPA in one cyan pass.'
              echo 'CAUTION: ZIP verification cannot establish device runtime compatibility.'
              integration='cyan-success'
              # All successfully built optional packages are in the output.
              # Failed requested tweaks remain explicitly listed in summary.
              if [[ -s selected-failed.txt ]]; then
                integration='cyan-partial'
              fi
            else
              rm -f "$candidate"
              cp -f baseline-ytkace.ipa "$output"
              echo '::warning::Selected tweaks could not be validated/integrated; preserving YTKACE-only IPA.'
              echo 'FAILED optional-injection: cyan or IPA validation; YTKACE baseline retained' >> selected-failed.txt
              integration='fallback-ytkace-only'
              final_output="YouTube_${youtube_version}_YTKACE_${version}_FALLBACK_NO_OPTIONAL_TWEAKS.ipa"
              mv -f "$output" "$final_output"
            fi
          else
            echo 'No optional tweaks selected/built; YTKACE-only IPA retained.'
            integration='ytkace-only'
            if [[ -s requested-tweaks.txt ]]; then
              integration='fallback-no-optional-debs-built'
              final_output="YouTube_${youtube_version}_YTKACE_${version}_FALLBACK_NO_OPTIONAL_TWEAKS.ipa"
              mv -f "$output" "$final_output"
            fi
          fi
          # The baseline must be kept intact whenever the optional integration fails.
          python3 - "$final_output" <<'PY_FINAL_VERIFY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist') for n in z.namelist())
          PY_FINAL_VERIFY
          rm -f baseline-ytkace.ipa
          echo "ipa=$final_output" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo '## Selected tweaks build and integration' >> "$GITHUB_STEP_SUMMARY"
          echo "**Integration result:** $integration" >> "$GITHUB_STEP_SUMMARY"
          echo '### Successfully built optional DEBs (not proof of injection)' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s selected-success.txt ]]; then cat selected-success.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'None' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '### Libraries found in final IPA' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$final_output" "$GITHUB_STEP_SUMMARY" <<'PY_SUMMARY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              libs=sorted({n.rsplit('/',1)[-1] for n in z.namelist()
                           if n.endswith('.dylib') and not n.endswith('.dSYM')})
          with open(sys.argv[2], 'a') as f:
              f.write('\n'.join('- ' + name for name in libs) + '\n' if libs else 'No .dylib filenames found\n')
          PY_SUMMARY
          echo '### Skipped or failed optional builds / runtime dependencies' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s selected-failed.txt ]]; then cat selected-failed.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'None' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '### Requested tweak options' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s requested-tweaks.txt ]]; then cat requested-tweaks.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'None' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '**RYD:** Executable-based substrate filter applied when requested; if the dislike count still does not appear, test RYD alone because current YouTube UI layouts and other tweaks may conflict.' >> "$GITHUB_STEP_SUMMARY"
          echo '**RYD diagnostics v5:** On iPhone open YouTube > Settings > Return YouTube Dislike > RYD 진단 보기 (탭). Run RYD API 직접 검사 on the iPhone, then watch a video and Short; open RYD 진단 보기 and copy the results. A Mac is NOT required. If the setting entry is absent or the build failed, check the build summary.' >> "$GITHUB_STEP_SUMMARY"
          echo '**Note:** CI API testing cannot prove iPhone connectivity, runtime hook invocation, or dislike display.' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$integration" == fallback* ]]; then
            echo '::warning::Requested tweaks were not included. Final IPA is marked FALLBACK in its filename.'
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

  publish-release:
    name: Publish IPA + DEB to GitHub Releases
    needs: [ytkace, package]
    if: ${{ github.ref == 'refs/heads/main' && needs.ytkace.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: youtube-build-${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: YouTube-IPA
          path: release-files/ipa
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: release-files/deb
      - name: Validate and publish IPA plus DEB
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(release-files/ipa/*.ipa)
          debs=(release-files/deb/*.deb)
          if (( ${#ipas[@]} != 1 || ${#debs[@]} != 1 )); then
            echo 'Expected exactly one IPA and one DEB' >&2
            exit 1
          fi
          dpkg-deb --info "${debs[0]}" >/dev/null
          assets=("${ipas[0]}" "${debs[0]}")
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          notes='YTKACE IPA and Rootless DEB. Selected tweak DEBs, when built, are integrated from the original decrypted IPA in one cyan pass. See Actions summary for included/failed tweaks. A FALLBACK filename means optional tweaks were NOT injected. No individual tweak artifacts. Device compatibility requires testing.'
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$REPO"
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "YouTube IPA + YTKACE DEB (run $GITHUB_RUN_ID)" \
              --notes "$notes" "${assets[@]}"
          fi
          echo "https://github.com/$REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
