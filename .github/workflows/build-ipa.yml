name: IPA (YTKACE + optional Sideloadly tweak artifacts)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Decrypted YouTube IPA URL
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: RYD for Sideloadly artifact (default OFF)
        type: boolean
        default: false
      add_ytuhd:
        description: YTUHD (jailbreak-only dependency observed; default OFF)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig (crashes on non-jailbroken phone; default OFF)
        type: boolean
        default: false
      add_youquality:
        description: YouQuality (requires YTVideoOverlay; default OFF)
        type: boolean
        default: false
      add_youslider:
        description: YouSlider (crashes on non-jailbroken phone; default OFF)
        type: boolean
        default: false
      add_youmute:
        description: YouMute (requires YTVideoOverlay; default OFF)
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote (jailbreak-only dependency observed; default OFF)
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent (untested; default OFF)
        type: boolean
        default: false
      add_yougetcaption:
        description: YouGetCaption (requires YTVideoOverlay; default OFF)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  ytkace:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Build YTKACE Rootless DEB and extract shipped library
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
          mkdir -p built-ytkace built-deb extracted
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Rootless DEB, found ${#packages[@]}" >&2
            exit 1
          fi
          version="$(awk '/^Version:/ {print $2}' control)"
          test -n "$version"
          deb="built-deb/com.itzzace.ytkace_${version}_rootless.deb"
          cp "${packages[0]}" "$deb"
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY_YTKACE'
          from pathlib import Path
          import shutil, struct, sys
          libs=[p for p in Path('extracted').rglob('YTKACE.dylib') if p.is_file()]
          if len(libs)!=1:
              sys.exit(f'Expected exactly one YTKACE.dylib in DEB, found: {libs}')
          p=libs[0]
          with p.open('rb') as f:
              magic=f.read(4)
              endian={b'\xfe\xed\xfa\xce':'>',b'\xce\xfa\xed\xfe':'<',b'\xfe\xed\xfa\xcf':'>',b'\xcf\xfa\xed\xfe':'<'}
              if magic not in endian:
                  sys.exit(f'YTKACE is not thin Mach-O: {p}; magic={magic.hex()}')
              f.seek(12)
              kind=struct.unpack(endian[magic]+'I',f.read(4))[0]
              if kind!=6:
                  sys.exit(f'YTKACE library has Mach-O type {kind}, expected MH_DYLIB (6): {p}')
          shutil.copy2(p,'built-ytkace/YTKACE.dylib')
          print('Using packaged real YTKACE library:',p)
          PY_YTKACE
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-library
          path: built-ytkace/YTKACE.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-rootless
          path: built-deb/*.deb
          if-no-files-found: error

  extra-tweaks:
    if: ${{ inputs.add_ryd || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_youquality || inputs.add_youslider || inputs.add_youmute || inputs.add_ytsilentvote || inputs.add_donteatmycontent || inputs.add_yougetcaption }}
    runs-on: ${{ inputs.add_ytuhd && 'macos-15' || 'ubuntu-24.04' }}
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Build tools for YTUHD (selected only)
        if: ${{ inputs.add_ytuhd }}
        run: |
          set -euo pipefail
          brew install meson ninja pkg-config autoconf automake libtool nasm yasm
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install shared headers
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/include"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          test -f "$THEOS/include/PSHeader/Misc.h"
          test -f "$THEOS/include/YouTubeHeader/YTLikeStatus.h"

      - name: Build selected tweaks
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
          ADD_YTUHD: ${{ inputs.add_ytuhd }}
          ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
          ADD_YOUQUALITY: ${{ inputs.add_youquality }}
          ADD_YOUSLIDER: ${{ inputs.add_youslider }}
          ADD_YOUMUTE: ${{ inputs.add_youmute }}
          ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
          ADD_YOUGETCAPTION: ${{ inputs.add_yougetcaption }}
        run: |
          set -euo pipefail
          mkdir -p extra-built sources

          build_tweak() {
            local key="$1" repo="$2" flag="$3"
            if [[ "$flag" != true ]]; then
              echo "SKIP $key"
              return
            fi
            echo "Building $key from $repo"
            local checkout="sources/$key"
            if [[ "$key" == ytvideooverlay ]]; then
              checkout="sources/YTVideoOverlay"
            fi
            git clone --depth 1 --recurse-submodules "https://github.com/${repo}.git" "$checkout"
            pushd "$checkout"

            if [[ "$key" == donteatmycontent ]]; then
              # Tweak.h defines a global that is compiled into two .o files.
              # Keep one definition in Tweak.x; declare it extern in Tweak.h.
              python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('Tweak.h')
          s = p.read_text()
          before = 'CGFloat constant;'
          assert s.count(before) == 1, 'Unexpected upstream Tweak.h; do not patch blindly'
          p.write_text(s.replace(before, 'extern CGFloat constant;', 1))
          t = Path('Tweak.x')
          t_src = t.read_text()
          marker = '#import "Tweak.h"'
          assert marker in t_src, 'Unexpected Tweak.x imports'
          t.write_text(t_src.replace(marker, marker + '\nCGFloat constant;', 1))
          PYFIX
            fi

            make clean || true
            if [[ "$key" == ytuhd ]]; then
              git submodule update --init --recursive
              make libvpx
              make dav1d
              make SIDELOAD=1 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
            else
              make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
            fi
            # Copy only real MH_DYLIB binaries. Theos may generate .dylib
            # files with MH_DSYM (type 10); those cannot be signed or loaded.
            # Never select by filename or find ordering alone.
            python3 - "$key" "../../extra-built/$key" <<'PYLIB'
          from pathlib import Path
          import shutil
          import struct
          import sys

          key, target = sys.argv[1:]
          destination = Path(target)
          root = Path('.theos/obj')
          if not root.is_dir():
              sys.exit(f'ERROR [{key}]: .theos/obj not found')

          thin = {
              b'\xfe\xed\xfa\xce': '>', b'\xce\xfa\xed\xfe': '<',
              b'\xfe\xed\xfa\xcf': '>', b'\xcf\xfa\xed\xfe': '<',
          }
          fat = {
              b'\xca\xfe\xba\xbe': ('>', 20),
              b'\xbe\xba\xfe\xca': ('<', 20),
              b'\xca\xfe\xba\xbf': ('>', 24),
              b'\xbf\xba\xfe\xca': ('<', 24),
          }

          def types(file, offset=0, depth=0):
              if depth > 2:
                  raise ValueError('nested fat Mach-O header')
              file.seek(offset)
              magic = file.read(4)
              if magic in thin:
                  file.seek(offset + 12)
                  data = file.read(4)
                  if len(data) != 4:
                      raise ValueError('truncated Mach-O header')
                  return [struct.unpack(thin[magic] + 'I', data)[0]]
              if magic in fat:
                  byteorder, size = fat[magic]
                  raw_count = file.read(4)
                  if len(raw_count) != 4:
                      raise ValueError('truncated fat header')
                  count = struct.unpack(byteorder + 'I', raw_count)[0]
                  if not 1 <= count <= 64:
                      raise ValueError('invalid fat slice count')
                  result = []
                  for idx in range(count):
                      file.seek(offset + 8 + idx * size)
                      entry = file.read(size)
                      if len(entry) != size:
                          raise ValueError('truncated fat architecture table')
                      position = struct.unpack_from(
                          byteorder + ('Q' if size == 24 else 'I'), entry, 8
                      )[0]
                      result.extend(types(file, offset + position, depth + 1))
                  return result
              return []

          candidates = sorted(root.rglob('*.dylib'))
          picked = {}
          for lib in candidates:
              if any(part.lower().endswith('.dsym') for part in lib.parts):
                  print(f'SKIP dSYM bundle: {lib}')
                  continue
              with lib.open('rb') as stream:
                  file_types = types(stream)
              if not file_types or not all(t == 6 for t in file_types):
                  print(f'SKIP non-MH_DYLIB: {lib} (types: {file_types})')
                  continue
              if lib.name in picked:
                  print(f'SKIP duplicate real dylib: {lib} (using {picked[lib.name]})')
                  continue
              picked[lib.name] = lib

          if not picked:
              sys.exit(f'ERROR [{key}]: no valid MH_DYLIB found; refusing to package dSYM')

          destination.mkdir(parents=True, exist_ok=True)
          for name, lib in sorted(picked.items()):
              shutil.copy2(lib, destination / name)
              print(f'INCLUDE real dylib [{key}]: {lib} -> {destination / name}')
          PYLIB
            popd
          }

          # Build dependencies first. YTVideoOverlay is needed by the three
          # overlay clients; it is never built on the default safe profile.
          if [[ "$ADD_YOUQUALITY" == true || "$ADD_YOUMUTE" == true || "$ADD_YOUGETCAPTION" == true ]]; then
            build_tweak ytvideooverlay PoomSmart/YTVideoOverlay true
          fi
          build_tweak ryd PoomSmart/Return-YouTube-Dislikes "$ADD_RYD"
          build_tweak ytuhd PoomSmart/YTUHD "$ADD_YTUHD"
          build_tweak ytabconfig PoomSmart/YTABConfig "$ADD_YTABCONFIG"
          build_tweak youquality PoomSmart/YouQuality "$ADD_YOUQUALITY"
          build_tweak youslider PoomSmart/YouSlider "$ADD_YOUSLIDER"
          build_tweak youmute PoomSmart/YouMute "$ADD_YOUMUTE"
          build_tweak ytsilentvote PoomSmart/YTSilentVote "$ADD_YTSILENTVOTE"
          build_tweak donteatmycontent therealFoxster/DontEatMyContent "$ADD_DONTEATMYCONTENT"
          build_tweak yougetcaption PoomSmart/YouGetCaption "$ADD_YOUGETCAPTION"
          printf 'Selected tweak dylibs (not DEB packages).\n' > extra-built/README.txt
          find extra-built -type f -name '*.dylib' -print | sort

      - name: Prepare Sideloadly tweak files
        run: |
          set -euo pipefail
          mkdir -p sideloadly-tweaks
          python3 - <<'PY_ARTIFACT'
          from pathlib import Path
          import shutil, sys
          source=Path('extra-built')
          target=Path('sideloadly-tweaks')
          libraries=sorted(source.rglob('*.dylib'))
          names=set()
          lines=['Sideloadly optional tweak libraries',
                 'Extract this artifact ZIP and select desired .dylib files in Sideloadly.',
                 'Enable the appropriate Cydia Substrate injection option for tweaks that require it.',
                 'Libraries are not inside the YouTube-IPA artifact.',
                 'Do not inject jailbreak-only tweaks on stock iOS without compatible runtime.', '']
          for f in libraries:
              if f.name in names:
                  sys.exit(f'ERROR: duplicate library name in selected tweaks: {f.name}')
              names.add(f.name)
              shutil.copy2(f,target/f.name)
              lines.append(f'{f.parent.name}: {f.name}')
              print('SIDELOADLY ARTIFACT:',f)
          if not libraries:lines.append('No optional tweaks selected (all OFF).')
          (target/'README.txt').write_text('\n'.join(lines)+'\n')
          PY_ARTIFACT

      - uses: actions/upload-artifact@v7
        with:
          name: Sideloadly-Selected-Tweaks
          path: sideloadly-tweaks/
          if-no-files-found: error

  package:
    needs: [ytkace]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-library
          path: built-ytkace
      - name: Install packaging tools
        run: brew install ldid
      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PYVALIDATE'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'Not a valid IPA/ZIP'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist') for n in z.namelist())
          PYVALIDATE
      - name: Inject YTKACE only (optional tweaks remain separate)
        id: inject
        run: |
          set -euo pipefail
          ytkace="$(find built-ytkace -name YTKACE.dylib -type f -print -quit)"
          test -n "$ytkace" || { echo 'Missing YTKACE library' >&2; exit 1; }
          export LDID="$(brew --prefix)/bin/ldid"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY_VERSION'
          import plistlib,zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info=next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PY_VERSION
          )"
          output="YouTube_${youtube_version}_YTKACE_${version}.ipa"
          bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output"
          bash Tools/verify-artifacts.sh "$ytkace" "$output"
          python3 - "$output" <<'PY_VERIFY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              libs=[x for x in archive.namelist() if '/Frameworks/' in x and x.endswith('.dylib')]
              if not any(x.endswith('/Frameworks/YTKACE.dylib') for x in libs):
                  sys.exit('YTKACE missing from IPA')
              unexpected=[x for x in libs if x.rsplit('/',1)[-1] in {
                  'YouTubeDislikesReturn.dylib','YTVideoOverlay.dylib',
                  'YTUHD.dylib','YTABConfig.dylib','YouSlider.dylib',
                  'YTSilentVote.dylib','YouMute.dylib','YouQuality.dylib',
                  'DontEatMyContent.dylib','YouGetCaption.dylib'}]
              if unexpected:sys.exit('Unexpected optional tweak embedded in IPA: '+str(unexpected))
          print('IPA verified: YTKACE only; optional tweaks are separate')
          PY_VERIFY
          echo "ipa=$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

