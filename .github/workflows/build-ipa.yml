        \    final_output=\"YouTube_${youtube_version}_YTKACE_${version}_FALLBACK_NO_OPTIONAL_TWEAKS.ipa\"\n   \
        \ mv -f \"$output\" \"$final_output\"\n  fi\nelse\n  echo 'No optional tweaks selected/built; YTKACE-only\
        \ IPA retained.'\n  integration='ytkace-only'\n  if [[ -s requested-tweaks.txt ]]; then\n    integration='fallback-no-optional-debs-built'\n\
        \    final_output=\"YouTube_${youtube_version}_YTKACE_${version}_FALLBACK_NO_OPTIONAL_TWEAKS.ipa\"\n   \
        \ mv -f \"$output\" \"$final_output\"\n  fi\nfi\n# If RYD was requested, never silently publish a YTKACE-only\
        \ fallback.\nif [[ \"$REQUIRE_RYD\" == true && \"$integration\" != cyan-success && \"$integration\" != cyan-partial\
        \ ]]; then\n  echo \"::error::RYD was requested but integration=$integration. IPA publishing blocked.\"\n\
        \  exit 1\nfi\npython3 - \"$final_output\" \"$REQUIRE_RYD\" <<'PY_FINAL_VERIFY'\nimport sys, zipfile\nipa,\
        \ require_ryd = sys.argv[1:]\nwith zipfile.ZipFile(ipa) as z:\n    assert z.testzip() is None\n    assert\
        \ any(n.startswith('Payload/') and n.endswith('.app/Info.plist') for n in z.namelist())\n    libs = [name\
        \ for name in z.namelist() if name.endswith('.dylib')]\n    if require_ryd == 'true':\n        matches =\
        \ [name for name in libs if name.split('/')[-1] == 'YouTubeDislikesReturn.dylib'\n                   and\
        \ name.startswith('Payload/') and '.app/' in name]\n        assert len(matches) == 1, f'REQUIRED RYD DYLIB\
        \ NOT FOUND IN FINAL IPA: {matches}'\n        assert len(z.read(matches[0])) > 32, 'RYD dylib is empty'\n\
        \        print(f'PASS: RYD present in final IPA: {matches[0]}')\nPY_FINAL_VERIFY\nrm -f baseline-ytkace.ipa\n\
        echo \"ipa=$final_output\" >> \"$GITHUB_OUTPUT\"\necho \"integration=$integration\" >> \"$GITHUB_OUTPUT\"\
        \necho '## Selected tweaks build and integration' >> \"$GITHUB_STEP_SUMMARY\"\necho \"**Integration result:**\
        \ $integration\" >> \"$GITHUB_STEP_SUMMARY\"\necho '### Successfully built optional DEBs (not proof of injection)'\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nif [[ -s selected-success.txt ]]; then cat selected-success.txt >> \"$GITHUB_STEP_SUMMARY\"\
        ; else echo 'None' >> \"$GITHUB_STEP_SUMMARY\"; fi\necho '### Libraries found in final IPA' >> \"$GITHUB_STEP_SUMMARY\"\
        \npython3 - \"$final_output\" \"$GITHUB_STEP_SUMMARY\" <<'PY_SUMMARY'\nimport sys, zipfile\nwith zipfile.ZipFile(sys.argv[1])\
        \ as z:\n    libs=sorted({n.rsplit('/',1)[-1] for n in z.namelist()\n                 if n.endswith('.dylib')\
        \ and not n.endswith('.dSYM')})\nwith open(sys.argv[2], 'a') as f:\n    f.write('\\n'.join('- ' + name for\
        \ name in libs) + '\\n' if libs else 'No .dylib filenames found\\n')\nPY_SUMMARY\necho '### Skipped or failed\
        \ optional builds / runtime dependencies' >> \"$GITHUB_STEP_SUMMARY\"\nif [[ -s selected-failed.txt ]];\
        \ then cat selected-failed.txt >> \"$GITHUB_STEP_SUMMARY\"; else echo 'None' >> \"$GITHUB_STEP_SUMMARY\"\
        ; fi\necho '### Requested tweak options' >> \"$GITHUB_STEP_SUMMARY\"\nif [[ -s requested-tweaks.txt ]];\
        \ then cat requested-tweaks.txt >> \"$GITHUB_STEP_SUMMARY\"; else echo 'None' >> \"$GITHUB_STEP_SUMMARY\"\
        ; fi\necho '**RYD:** Executable-based substrate filter applied when requested; if the dislike count still\
        \ does not appear, test RYD alone because current YouTube UI layouts and other tweaks may conflict.' >>\
        \ \"$GITHUB_STEP_SUMMARY\"\necho \"**RYD v10.12 diagnostic:** Existing labels re-check panel/fresh data\
        \ on redraw; ambiguous zero is not committed; iPhone verification required.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho '**Note:** CI API testing cannot prove iPhone connectivity, runtime hook invocation, or dislike display.'\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nif [[ \"$integration\" == fallback* ]]; then\n  echo '::warning::Requested\
        \ tweaks were not included. Final IPA is marked FALLBACK in its filename.'\nfi\n"
    - name: Verify selected YTABConfig Mix patch in final IPA
      if: ${{ inputs.add_ytabconfig }}
      shell: bash
      env:
        IPA_PATH: ${{ steps.inject.outputs.ipa }}
      run: |
        set -euo pipefail
        python3 - "$IPA_PATH" <<'PY_MIX_VERIFY'
        import sys, zipfile
        from pathlib import PurePosixPath
        with zipfile.ZipFile(sys.argv[1]) as z:
            paths = [p for p in z.namelist() if p.startswith('Payload/') and PurePosixPath(p).name.lower() == 'ytabconfig.dylib']
            assert len(paths) == 1, f'Expected selected YTABConfig dylib: {paths}'
            assert b'YTABC-MixPostHook-v3' in z.read(paths[0]), 'Compiled YTABConfig Mix post-hook patch missing'
            print('PASS: patched YTABConfig included in final IPA')
        PY_MIX_VERIFY
    - name: Verify selected YTBackgroundOnly in final IPA
      if: ${{ inputs.add_ytbackgroundonly }}
      shell: bash
      env:
        IPA_PATH: ${{ steps.inject.outputs.ipa }}
      run: |
        set -euo pipefail
        python3 - "$IPA_PATH" <<'PY_YTBACKGROUND_VERIFY'
        import sys, zipfile
        from pathlib import PurePosixPath
        with zipfile.ZipFile(sys.argv[1]) as z:
            matches = [n for n in z.namelist()
                       if n.startswith('Payload/') and '.app/' in n
                       and PurePosixPath(n).name == 'YTBackgroundOnly.dylib']
            assert len(matches) == 1, f'YTBackgroundOnly selected but library is missing: {matches}'
            assert len(z.read(matches[0])) > 32, 'YTBackgroundOnly library is empty'
            print('PASS: YTBackgroundOnly library included in final IPA')
        PY_YTBACKGROUND_VERIFY
    - uses: actions/upload-artifact@v7
      with:
        name: YouTube-IPA
        path: ${{ steps.inject.outputs.ipa }}
        if-no-files-found: error
  publish-release:
    name: Publish IPA + DEB to GitHub Releases
    needs:
    - ytkace
    - package
    if: ${{ github.ref == 'refs/heads/main' && needs.ytkace.result == 'success' && needs.package.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: youtube-build-${{ github.run_id }}
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: YouTube-IPA
        path: release-files/ipa
    - uses: actions/download-artifact@v8
      with:
        name: YTKACE-deb-rootless
        path: release-files/deb
    - name: Validate and publish IPA plus DEB
      shell: bash
      run: "set -euo pipefail\nshopt -s nullglob\nipas=(release-files/ipa/*.ipa)\ndebs=(release-files/deb/*.deb)\n\
        if (( ${#ipas[@]} != 1 || ${#debs[@]} != 1 )); then\n  echo 'Expected exactly one IPA and one DEB' >&2\n\
        \  exit 1\nfi\ndpkg-deb --info \"${debs[0]}\" >/dev/null\nassets=(\"${ipas[0]}\" \"${debs[0]}\")\nsha256sum\
        \ \"${assets[@]}\" > SHA256SUMS.txt\nassets+=(SHA256SUMS.txt)\nnotes='YTKACE IPA and Rootless DEB. Selected\
        \ tweak DEBs, when built, are integrated from the original decrypted IPA in one cyan pass. See Actions summary\
        \ for included/failed tweaks. A FALLBACK filename means optional tweaks were NOT injected. No individual\
        \ tweak artifacts. Device compatibility requires testing.'\nif gh release view \"$RELEASE_TAG\" --repo \"\
        $REPO\" >/dev/null 2>&1; then\n  gh release upload \"$RELEASE_TAG\" \"${assets[@]}\" --clobber --repo \"\
        $REPO\"\nelse\n  gh release create \"$RELEASE_TAG\" --repo \"$REPO\" --target \"$GITHUB_SHA\" \\\n    --title\
        \ \"YouTube IPA + YTKACE DEB (run $GITHUB_RUN_ID)\" \\\n    --notes \"$notes\" \"${assets[@]}\"\nfi\necho\
        \ \"https://github.com/$REPO/releases/tag/$RELEASE_TAG\" >> \"$GITHUB_STEP_SUMMARY\"\n"
