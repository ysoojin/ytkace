name: IPA (YTKACE + selected tweaks, IPA and DEB)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Decrypted YouTube IPA URL
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/odyv50o9pgx7fh8nr8u5h/com.google.ios.youtube-21.45.4-Decrypted.ipa?rlkey=q8sq80ak1t8qr0pwe1t8f448e&st=tqx7k2kt&dl=1'
      add_ryd:
        description: RYD optional IPA injection (default OFF; may require Substrate)
        type: boolean
        default: false
      add_ryd_direct:
        description: RYD direct IPA injection (legacy option, default OFF)
        type: boolean
        default: false
      add_ytuhd:
        description: YTUHD (jailbreak-only dependency observed; default OFF)
        type: boolean
        default: false
      add_ytabconfig:
        description: YTABConfig (crashes on non-jailbroken phone; default OFF)
        type: boolean
        default: false
      add_youquality:
        description: YouQuality (requires YTVideoOverlay; default OFF)
        type: boolean
        default: false
      add_youslider:
        description: YouSlider (crashes on non-jailbroken phone; default OFF)
        type: boolean
        default: false
      add_youmute:
        description: YouMute (requires YTVideoOverlay; default OFF)
        type: boolean
        default: false
      add_ytsilentvote:
        description: YTSilentVote (jailbreak-only dependency observed; default OFF)
        type: boolean
        default: false
      add_donteatmycontent:
        description: DontEatMyContent (untested; default OFF)
        type: boolean
        default: false
      add_yougetcaption:
        description: YouGetCaption (requires YTVideoOverlay; default OFF)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  ytkace:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Build YTKACE Rootless DEB and extract shipped library
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
          mkdir -p built-ytkace built-deb extracted
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Rootless DEB, found ${#packages[@]}" >&2
            exit 1
          fi
          version="$(awk '/^Version:/ {print $2}' control)"
          test -n "$version"
          deb="built-deb/com.itzzace.ytkace_${version}_rootless.deb"
          cp "${packages[0]}" "$deb"
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY_YTKACE'
          from pathlib import Path
          import shutil, struct, sys
          libs=[p for p in Path('extracted').rglob('YTKACE.dylib') if p.is_file()]
          if len(libs)!=1:
              sys.exit(f'Expected exactly one YTKACE.dylib in DEB, found: {libs}')
          p=libs[0]
          with p.open('rb') as f:
              magic=f.read(4)
              endian={b'\xfe\xed\xfa\xce':'>',b'\xce\xfa\xed\xfe':'<',b'\xfe\xed\xfa\xcf':'>',b'\xcf\xfa\xed\xfe':'<'}
              if magic not in endian:
                  sys.exit(f'YTKACE is not thin Mach-O: {p}; magic={magic.hex()}')
              f.seek(12)
              kind=struct.unpack(endian[magic]+'I',f.read(4))[0]
              if kind!=6:
                  sys.exit(f'YTKACE library has Mach-O type {kind}, expected MH_DYLIB (6): {p}')
          shutil.copy2(p,'built-ytkace/YTKACE.dylib')
          print('Using packaged real YTKACE library:',p)
          PY_YTKACE
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-library
          path: built-ytkace/YTKACE.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-deb-rootless
          path: built-deb/*.deb
          if-no-files-found: error

  package:
    needs: ytkace
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-library
          path: built-ytkace
      - name: Install IPA tools
        run: brew install ldid
      - name: Install Theos for selected tweaks
        if: ${{ inputs.add_ryd || inputs.add_ryd_direct || inputs.add_ytuhd || inputs.add_ytabconfig || inputs.add_youquality || inputs.add_youslider || inputs.add_youmute || inputs.add_ytsilentvote || inputs.add_donteatmycontent || inputs.add_yougetcaption }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" || echo "WARN: optional Theos install failed; selected tweak builds may be skipped"
      - name: Build selected tweaks together (no tweak artifacts; failures are skipped)
        env:
          ADD_RYD: ${{ inputs.add_ryd }}
          ADD_RYD_DIRECT: ${{ inputs.add_ryd_direct }}
          ADD_YTUHD: ${{ inputs.add_ytuhd }}
          ADD_YTABCONFIG: ${{ inputs.add_ytabconfig }}
          ADD_YOUQUALITY: ${{ inputs.add_youquality }}
          ADD_YOUSLIDER: ${{ inputs.add_youslider }}
          ADD_YOUMUTE: ${{ inputs.add_youmute }}
          ADD_YTSILENTVOTE: ${{ inputs.add_ytsilentvote }}
          ADD_DONTEATMYCONTENT: ${{ inputs.add_donteatmycontent }}
          ADD_YOUGETCAPTION: ${{ inputs.add_yougetcaption }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extra-inject sources
          : > selected-success.txt
          : > selected-failed.txt
          # Keep this step successful when an optional tweak fails;
          # never publish an invalid binary from a failed build.
          mkdir -p "$THEOS/include"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader" || echo 'WARN: PSHeader unavailable'
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader" || echo 'WARN: YouTubeHeader unavailable'
          if [[ "$ADD_YTUHD" == true ]]; then
            brew install meson ninja pkg-config autoconf automake libtool nasm yasm || echo 'WARN: YTUHD build tools setup failed'
          fi

          build_one() {
            local key="$1" repo="$2" flag="$3" out="sources/$1"
            [[ "$flag" == true ]] || return 0
            echo "::group::Building optional tweak $key"
            if ! git clone --depth 1 --recurse-submodules "https://github.com/$repo.git" "$out"; then
              echo "FAILED $key: git clone" | tee -a selected-failed.txt
              echo '::endgroup::'
              return 0
            fi
            if [[ "$key" == donteatmycontent ]]; then
              python3 - "$out" <<'PY_PATCH'
          from pathlib import Path
          import sys
          d=Path(sys.argv[1]); h=d/'Tweak.h'; t=d/'Tweak.x'
          if h.exists() and t.exists():
              hs=h.read_text(); ts=t.read_text()
              if hs.count('CGFloat constant;')==1 and '#import "Tweak.h"' in ts:
                  h.write_text(hs.replace('CGFloat constant;','extern CGFloat constant;',1))
                  t.write_text(ts.replace('#import "Tweak.h"','#import "Tweak.h"\nCGFloat constant;',1))
          PY_PATCH
            fi
            # Run compilation in a contained command, so a single optional
            # failure cannot abort the entire IPA build.
            if ! ( cd "$out" && make clean >/dev/null 2>&1 || true
                   cd "$GITHUB_WORKSPACE/$out"
                   if [[ "$key" == ytuhd ]]; then
                     make libvpx && make dav1d && make SIDELOAD=1 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
                   else
                     make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_ROOTLESS_COMPAT_WARNING=1
                   fi ); then
              echo "FAILED $key: make" | tee -a selected-failed.txt
              echo '::endgroup::'
              return 0
            fi
            # Inspect Mach-O headers to reject MH_DSYM (type 10).
            if python3 - "$key" "$out/.theos/obj" extra-inject <<'PY_PICK'
          from pathlib import Path
          import struct,sys,shutil
          key,src,dst=sys.argv[1:]
          root=Path(src); dest=Path(dst)
          magic={b'\xfe\xed\xfa\xce':'>',b'\xce\xfa\xed\xfe':'<',b'\xfe\xed\xfa\xcf':'>',b'\xcf\xfa\xed\xfe':'<'}
          expect={'ryd':{'YouTubeDislikesReturn.dylib'}}
          found=[]
          for p in sorted(root.rglob('*.dylib')):
              if any(x.lower().endswith('.dsym') for x in p.parts):continue
              if key in expect and p.name not in expect[key]:continue
              with p.open('rb') as f:
                  m=f.read(4)
                  if m not in magic:continue
                  f.seek(12)
                  typ=struct.unpack(magic[m]+'I',f.read(4))[0]
              if typ==6:found.append(p)
          if not found:sys.exit('No real MH_DYLIB found for '+key)
          if key in expect and {p.name for p in found}!=expect[key]:sys.exit('Wrong RYD library')
          # Never accept duplicate filenames across selected tweaks.
          files={}
          for f in found:
              if f.name in files: continue
              if (dest/f.name).exists():sys.exit('Duplicate dylib name: '+f.name)
              files[f.name]=f
          # Validate the complete selection before copying any output.
          for name,f in files.items():
              shutil.copy2(f,dest/name)
              print('INJECTABLE',key,name)
          PY_PICK
            then
              echo "OK $key" | tee -a selected-success.txt
            else
              echo "FAILED $key: no valid dylib or duplicate" | tee -a selected-failed.txt
            fi
            echo '::endgroup::'
          }

          # Overlay source is needed for clients such as YouQuality and YouMute.
          overlay=false
          if [[ "$ADD_YOUQUALITY" == true || "$ADD_YOUMUTE" == true || "$ADD_YOUGETCAPTION" == true ]]; then
            overlay=true
          fi
          build_one ytvideooverlay PoomSmart/YTVideoOverlay "$overlay"
          # The overlay clients must not be packed if their shared dependency fails.
          if [[ "$overlay" == true ]] && ! grep -qx 'OK ytvideooverlay' selected-success.txt; then
            for key in youquality youmute yougetcaption; do
              echo "FAILED $key: YTVideoOverlay dependency unavailable" >> selected-failed.txt
            done
            ADD_YOUQUALITY=false
            ADD_YOUMUTE=false
            ADD_YOUGETCAPTION=false
          fi
          if [[ "$ADD_RYD" == true || "$ADD_RYD_DIRECT" == true ]]; then
            build_one ryd PoomSmart/Return-YouTube-Dislikes true
          fi
          build_one ytuhd PoomSmart/YTUHD "$ADD_YTUHD"
          build_one ytabconfig PoomSmart/YTABConfig "$ADD_YTABCONFIG"
          build_one youquality PoomSmart/YouQuality "$ADD_YOUQUALITY"
          build_one youslider PoomSmart/YouSlider "$ADD_YOUSLIDER"
          build_one youmute PoomSmart/YouMute "$ADD_YOUMUTE"
          build_one ytsilentvote PoomSmart/YTSilentVote "$ADD_YTSILENTVOTE"
          build_one donteatmycontent therealFoxster/DontEatMyContent "$ADD_DONTEATMYCONTENT"
          build_one yougetcaption PoomSmart/YouGetCaption "$ADD_YOUGETCAPTION"
          echo 'Successfully built libraries:'
          find extra-inject -maxdepth 1 -type f -name '*.dylib' -print | sort
          echo 'Skipped optional tweaks:'
          cat selected-failed.txt

      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl -fL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "$IPA_URL" -o YouTube.ipa
          else
            curl -fL --retry 3 "$IPA_URL" -o YouTube.ipa
          fi
          python3 - <<'PY_IPA'
          import zipfile
          assert zipfile.is_zipfile('YouTube.ipa'), 'Invalid IPA'
          with zipfile.ZipFile('YouTube.ipa') as z:
              assert any(x.startswith('Payload/') and x.endswith('.app/Info.plist') for x in z.namelist())
          PY_IPA

      - name: Package YTKACE and all successful optional tweaks as one IPA
        id: inject
        shell: bash
        run: |
          set -euo pipefail
          ytkace=built-ytkace/YTKACE.dylib
          test -s "$ytkace"
          export LDID="$(brew --prefix)/bin/ldid"
          version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY_VER'
          import plistlib,zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info=next(x for x in z.namelist() if x.startswith('Payload/') and x.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PY_VER
          )"
          output="YouTube_${youtube_version}_YTKACE_${version}.ipa"
          bash Scripts/sideload-repack.sh YouTube.ipa "$ytkace" "$output"
          if find extra-inject -maxdepth 1 -type f -name '*.dylib' | grep -q .; then
            # Keep the known-good YTKACE-only IPA until injection and signing
            # have both succeeded. An optional tweak can never destroy it.
            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT
            if (
              set -e
              unzip -q "$output" -d "$work"
              app="$(find "$work/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$app"
              executable="$(python3 - "$app/Info.plist" <<'PY_MAIN'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f:print(plistlib.load(f)['CFBundleExecutable'])
          PY_MAIN
              )"
              mkdir -p "$app/Frameworks"
              while IFS= read -r -d '' lib; do
                name="$(basename "$lib")"
                cp "$lib" "$app/Frameworks/$name"
                python3 Tools/macho_inject.py "$app/$executable" --add-load "@rpath/$name"
              done < <(find extra-inject -maxdepth 1 -type f -name '*.dylib' -print0)
              bash Scripts/sign-bundle.sh "$app"
              (cd "$work" && zip -qry "$GITHUB_WORKSPACE/$output.optional" Payload)
            ); then
              mv -f "$output.optional" "$output"
              echo 'Optional tweaks successfully bundled into IPA.'
            else
              rm -f "$output.optional"
              echo 'WARN: optional tweak injection/signing failed; publishing YTKACE-only IPA.'
              echo 'FAILED optional-injection: falling back to YTKACE-only IPA' >> selected-failed.txt
              : > selected-success.txt
            fi
          fi
          bash Tools/verify-artifacts.sh "$ytkace" "$output"
          echo "ipa=$output" >> "$GITHUB_OUTPUT"
          echo '## Optional tweak build results' >> "$GITHUB_STEP_SUMMARY"
          echo '### Successfully built' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s selected-success.txt ]]; then cat selected-success.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'None' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '### Actually included in final IPA' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$output" "$GITHUB_STEP_SUMMARY" <<'PY_FINAL'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              libs=sorted({n.rsplit('/',1)[-1] for n in z.namelist()
                           if '/Frameworks/' in n and n.endswith('.dylib')
                           and not n.endswith('/YTKACE.dylib')})
          with open(sys.argv[2],'a') as f:
              f.write('\n'.join('- '+x for x in libs)+'\n' if libs else 'None (YTKACE only)\n')
          PY_FINAL
          echo '### Skipped or failed' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s selected-failed.txt ]]; then cat selected-failed.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'None' >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

  publish-release:
    name: Publish IPA + DEB to GitHub Releases
    needs: [ytkace, package]
    if: ${{ github.ref == 'refs/heads/main' && needs.ytkace.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: youtube-build-${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: YouTube-IPA
          path: release-files/ipa
      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: release-files/deb
      - name: Validate and publish IPA plus DEB
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(release-files/ipa/*.ipa)
          debs=(release-files/deb/*.deb)
          if (( ${#ipas[@]} != 1 || ${#debs[@]} != 1 )); then
            echo 'Expected exactly one IPA and one DEB' >&2
            exit 1
          fi
          dpkg-deb --info "${debs[0]}" >/dev/null
          assets=("${ipas[0]}" "${debs[0]}")
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          notes='YTKACE IPA and Rootless DEB. Selected tweaks were built within the IPA packaging job; failed optional tweaks were skipped. See Actions run summary for the actual included libraries. No separate tweak dylib artifacts.'
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$REPO"
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "YouTube IPA + YTKACE DEB (run $GITHUB_RUN_ID)" \
              --notes "$notes" "${assets[@]}"
          fi
          echo "https://github.com/$REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
